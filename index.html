  // Su claude.ai senza accesso il permesso «downloads» non c'è: spieghiamo perché e, se c'è, mostriamo la scheda qui
  function noDownload(preview) {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="dlg${preview ? ' wide' : ''}" role="dialog" aria-modal="true">
      <p><b>Da qui il file non si può scaricare.</b> La pagina è aperta su claude.ai senza aver fatto l'accesso, e claude.ai permette di salvare file solo a chi ha fatto l'accesso. Per scaricare, premi «Accedi» in alto, entra con il tuo account claude.ai e riprova. Oppure apri la stessa scheda qui, dove si scarica senza accesso: <b>s-zani.github.io/scheda-dnd</b></p>
      ${preview ? '<p>Intanto la scheda è qui sotto: puoi leggerla o farne uno screenshot.</p>' : ''}
      <div class="row"><button type="button" class="btn primary" data-r="1">Chiudi</button></div>
      ${preview ? `<div class="pv"><section class="tab active">${preview}</section></div>` : ''}</div>`;
    const onKey = e => { if (e.key === 'Escape') done(); };
    const done = () => { m.remove(); document.removeEventListener('keydown', onKey); };
    m.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('[data-r]') || e.target === m) done(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(m);
    m.querySelector('[data-r="1"]').focus();
  }

  // ------------------------------------------------------------------ messaggi e conferme dentro la pagina
  let toastTimer;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
  }
  function askConfirm(msg, okLabel) {
    return new Promise(res => {
      const m = document.createElement('div');
      m.className = 'modal';
      m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button type="button" class="btn" data-r="0">Annulla</button><button type="button" class="btn primary" data-r="1">${esc(okLabel)}</button></div></div>`;
      const onKey = e => { if (e.key === 'Escape') done(false); };
      const done = v => { m.remove(); document.removeEventListener('keydown', onKey); res(v); };
      m.addEventListener('click', e => {
        e.stopPropagation();
        const b = e.target.closest('[data-r]');
        if (b) done(b.dataset.r === '1'); else if (e.target === m) done(false);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(m);
      m.querySelector('[data-r="1"]').focus();
    });
  }

  // ------------------------------------------------------------------ disegno generale
  function renderAll() {
    const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    const R = CUR = compute();
    const st = stepStatus(R);
    renderNav(st);
    const tab = S._tab;
    const onChars = UI.page === 'personaggi';
    document.querySelectorAll('.tab').forEach(el => {
      const on = onChars ? el.id === 'tab-personaggi' : el.id === 'tab-' + tab;
      el.classList.toggle('active', on);
      if (!on && el.id !== 'tab-scheda') el.innerHTML = '';
    });
    if (onChars) renderTabChars();
    else {
      if (tab === 'classe') renderTabClass(R, st);
      if (tab === 'origine') renderTabOrigin(R, st);
      if (tab === 'caratteristiche') renderTabAbil(R, st);
      if (tab === 'allineamento') renderTabAlign(R, st);
      if (tab === 'dettagli') renderTabDetails(R, st);
    }
    renderSheet(R);
    const nChars = Object.keys(STORE.chars).length;
    $('btnChars').textContent = `I miei personaggi (${nChars})`;
    $('btnChars').classList.toggle('on', onChars);
    if (active) { const el = document.querySelector(`.tab.active [data-k="${active}"]`); if (el && el.tagName === 'SELECT') el.focus({ preventScroll: true }); }
    window.__R = R;
  }

  // ------------------------------------------------------------------ eventi
  // Quando cambia una scelta "a monte", azzera ciò che non è più valido
  function cleanup(key) {
    const clear = prefix => Object.keys(S).forEach(k => { if (k.startsWith(prefix)) delete S[k]; });
    if (key === 'classe') { delete S.sottoclasse; clear('ch_'); clear('sk_cls'); clear('mx_'); clear('wm_'); clear('ft_fs'); clear('fopt_'); S.eq_cls = 'A'; delete S.eq_applicato; UI.open.sottoclasse = false; }
    if (key === 'sottoclasse') clear('ch_s');
    if (key === 'specie') { clear('spc_'); delete S.taglia; clear('ft_orig2'); }
    if (key === 'background') { delete S.bg_piu2; delete S.bg_piu1; S.eq_bg = 'A'; delete S.eq_applicato; }
    if (key === 'eq_cls' || key === 'eq_bg') delete S.eq_applicato;
    if (key === 'metodo') ABIL.forEach(a => delete S['base_' + a.id]);
    if (/^ft_[^_]+$/.test(key)) clear(key + '_');
  }

  document.addEventListener('input', e => {
    const f = e.target;
    if (!f.dataset || !f.dataset.k || !('free' in f.dataset)) return;
    S[f.dataset.k] = f.type === 'checkbox' ? f.checked : f.value;
    persist();
  });
  document.addEventListener('change', e => {
    const f = e.target;
    if (f.type === 'file') { importInput(f); return; }
    if (f.dataset && f.dataset.cmp) { UI.cmp[f.dataset.cmp] = f.checked; renderAll(); return; }
    if (!f.dataset || !f.dataset.k) return;
    const k = f.dataset.k;
    S[k] = f.type === 'checkbox' ? f.checked : f.value;
    persist();
    if ('free' in f.dataset && k !== 'pf_max_man') {
      if (k === 'nome' || k === 'aspetto' || k === 'storia') renderNav(stepStatus(compute()));
      return;
    }
    cleanup(k);
    renderAll();
  });
  document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-prog]')) UI.prog = e.target.open; }, true);
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-pick][role="button"]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-pick],[data-ui],[data-tab],[data-act],[data-del]');
    if (!t || e.target.closest('summary')) return;
    if (t.dataset.pick) {
      const k = t.dataset.pick;
      const changed = S[k] !== t.dataset.val;
      S[k] = t.dataset.val;
      if (changed) cleanup(k);
      UI.open[k] = false;
      persist(); renderAll();
      const p = $('p-' + k);
      if (p && p.getBoundingClientRect().top < 60) p.scrollIntoView({ block: 'start' });
      return;
    }
    if (t.dataset.ui) {
      const [what, key, val] = t.dataset.ui.split(':');
      if (what === 'open') UI.open[key] = true;
      if (what === 'close') UI.open[key] = false;
      if (what === 'view') UI.view[key] = val;
      renderAll(); return;
    }
    if (t.dataset.tab) { S._tab = t.dataset.tab; UI.page = null; persist(); renderAll(); window.scrollTo({ top: 0 }); return; }
    if (t.dataset.del != null) {
      const i = +t.dataset.del;
      for (let j = i; j < S.incN - 1; j++) S['inc_' + j] = S['inc_' + (j + 1)];
      delete S['inc_' + (S.incN - 1)];
      S.incN = Math.max(1, S.incN - 1);
      persist(); renderAll(); return;
    }
    const act = t.dataset.act;
    if (act === 'addSpell') { S.incN++; persist(); renderAll(); return; }
    if (act === 'roll') {
      const d6 = () => 1 + Math.floor(Math.random() * 6);
      S.tiri = Array.from({ length: 6 }, () => { const r = [d6(), d6(), d6(), d6()].sort((a, b) => b - a); return r[0] + r[1] + r[2]; });
      ABIL.forEach(a => delete S['base_' + a.id]);
      persist(); renderAll(); return;
    }
    if (act === 'suggest') {
      const arr = STD_BY_CLASS[S.classe];
      if (arr) ABIL.forEach((a, i) => S['base_' + a.id] = String(arr[i]));
      persist(); renderAll(); return;
    }
    if (act === 'applyEquip') applyEquip();
    const id = t.dataset.id;
    if (act === 'goChar') openChar(id);
    if (act === 'dupChar') dupChar(id);
    if (act === 'delChar') delChar(id);
    if (act === 'favChar') favChar(id);
    if (act === 'printChar') printChar(id);
    if (act === 'newChar') newChar();
    if (act === 'saveFile') saveBundle();
    if (act === 'print') window.print();
  });

  async function applyEquip() {
    const R = compute();
    const pk = [];
    if (R.c && R.c.equipment) pk.push(byId(R.c.equipment, S.eq_cls) || R.c.equipment[0]);
    if (R.bg && R.bg.equipment) pk.push(byId(R.bg.equipment, S.eq_bg) || R.bg.equipment[0]);
    if (S.equipaggiamento && S.eq_applicato_una_volta && !(await askConfirm('Sostituire la lista degli oggetti e le monete d\'oro con quelli delle opzioni scelte?', 'Sostituisci'))) return;
    let gp = 0; const lines = []; const weapons = []; let armor = null, shield = false;
    pk.forEach(p => {
      gp += p.gp || 0;
      packItems(p).forEach(x => {
        lines.push(x.label + (x.it && x.it.kind === 'gear' && x.it.desc && /pack|dotazione/i.test(x.en + (x.it.it || '')) ? ` (${x.it.desc})` : ''));
        if (x.it && x.it.kind === 'armor') { if (x.it.category === 'scudi') shield = true; else armor = x.it.id; }
        if (x.it && x.it.kind === 'weapon' && !weapons.includes(x.it.id)) weapons.push(x.it.id);
      });
    });
    S.equipaggiamento = lines.join('\n');
    S.monete_mo = String(gp);
    S.armatura = armor || '';
    S.scudo = shield;
    for (let i = 0; i < 6; i++) { if (weapons[i]) S['arma_' + i] = weapons[i]; else if (!String(S['arma_' + i] || '').startsWith('sp:')) delete S['arma_' + i]; }
    S.eq_applicato = true;
    S.eq_applicato_una_volta = true;
    persist(); renderAll();
  }

  document.getElementById('helpToggle').addEventListener('change', e => { document.body.classList.toggle('nohelp', !e.target.checked); });
  if (IN_CLAUDE) $('btnPrint').textContent = 'Scarica la scheda stampabile';
  $('btnPrint').addEventListener('click', () => { if (IN_CLAUDE) printChar(STORE.cur); else window.print(); });
  $('btnSave').addEventListener('click', saveBundle);
  $('btnReset').addEventListener('click', newChar);
  $('btnDup').addEventListener('click', () => dupChar(STORE.cur));
  $('btnChars').addEventListener('click', () => { UI.page = UI.page === 'personaggi' ? null : 'personaggi'; renderAll(); window.scrollTo({ top: 0 }); });
  // Un'altra scheda del browser ha salvato: riprendi i suoi dati per non sovrascriverli
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try {
      const next = JSON.parse(e.newValue);
      if (!next || !next.chars) return;
      const cur = STORE.cur;
      STORE = next;
      STORE.cur = STORE.chars[cur] ? cur : (charIds()[0] || addChar({}));
      S = STORE.chars[STORE.cur].S; defaults(); renderAll();
    } catch (err) { /* file corrotto: si ignora */ }
  });
  window.addEventListener('beforeprint', () => { const R = compute(); renderSheet(R); });

  if (migrated) { dirty.add(STORE.cur); writeLocal(); } // il vecchio salvataggio a un solo personaggio diventa il primo della lista
  renderAll();
  setStatus('Salvataggio automatico attivo');
  cloudInit();
})();
</script>
</body>
</html>
