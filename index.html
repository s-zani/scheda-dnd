<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda personaggio D&amp;D 2024</title>
<style>
  :root {
    color-scheme: light; /* un solo aspetto chiaro, da pergamena */
    --bg: #ede7df;
    --paper: #fffdfa;
    --ink: #2a221d;
    --muted: #75685e;
    --accent: #8b1c1c;
    --accent-dark: #5e1111;
    --accent-soft: #f8ebe7;
    --line: #e2d7ca;
    --line-strong: #b9a797;
    --field: #f6f1eb;
    --calc: #f0ebf7;
    --calc-line: #d3c6e4;
    --hint-bg: #fff8e5;
    --hint-line: #ead18c;
    --ok: #2f6b3a;
    --ok-bg: #edf6ee;
    --warn: #a3520b;
    --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
  button { font: inherit; }

  /* ---------------- barra e navigazione ---------------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 20px; background: #2a221d; color: #fff; }
  .toolbar .title { font-family: var(--serif); font-size: 17px; margin-right: auto; }
  .toolbar .title small { font-family: var(--sans); font-size: 12px; color: #cbbfb4; margin-left: 6px; }
  .toolbar button, .toolbar label.tb { cursor: pointer; background: #463b34; color: #fff; border: 1px solid #66574c; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  .toolbar button:hover, .toolbar label.tb:hover { background: #57493f; }
  .toolbar .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
  .toolbar .status { font-size: 12px; color: #cbbfb4; min-width: 70px; }
  .toolbar .status.ok { color: #b9e0bf; }
  .toolbar .status.bad { color: #ffcf9e; }
  .toolbar button.tb-main { background: #6e2b22; border-color: #93483d; font-weight: 600; }
  .toolbar button.tb-main.on { background: var(--accent); border-color: #c0675b; }

  .stepnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255, 253, 250, .97); border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .stepnav .in { max-width: 1180px; margin: 0 auto; display: flex; gap: 6px; padding: 8px 20px; overflow-x: auto; }
  .pill { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 14px 5px 5px; cursor: pointer; color: var(--ink); text-align: left; }
  .pill:hover { border-color: var(--line-strong); }
  .pill .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--field); font-weight: 700; font-size: 13px; flex: none; }
  .pill .t { font-weight: 600; font-size: 13px; line-height: 1.15; }
  .pill .s { display: block; font-weight: 400; font-size: 11px; color: var(--warn); }
  .pill.done .n { background: var(--ok); color: #fff; }
  .pill.done .s { color: var(--ok); }
  .pill.active { border-color: var(--accent); background: var(--accent-soft); }
  .pill.active .n { background: var(--accent); color: #fff; }
  .pill.final { flex: 0 0 auto; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 40px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .intro { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
  .intro .big-n { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 22px var(--serif); }
  .intro h1 { font-size: 26px; color: var(--ink); }
  .intro p { margin: 4px 0 0; color: var(--muted); max-width: 820px; }

  /* ---------------- pannelli ---------------- */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px 18px; margin-bottom: 16px; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ph h2 { font-size: 19px; display: flex; align-items: center; gap: 8px; }
  .ph-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lead { margin: 0 0 12px; color: var(--muted); max-width: 860px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .two > *, .cards > *, .grid > *, .picks > *, .ctrl > *, .sh-cols > *, .sh-row2 > *, .tiles > * { min-width: 0; }
  .lbl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .sub { font-size: 12px; color: var(--muted); font-weight: 400; }
  .center { text-align: center; }

  input[type=text], input[type=number], textarea, select { width: 100%; max-width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid #d6c8b9; border-radius: 6px; padding: 6px 8px; }
  select { cursor: pointer; padding: 5px 6px; text-overflow: ellipsis; }
  select:disabled { cursor: not-allowed; color: var(--muted); }
  input:focus, textarea:focus, select:focus, .card:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; background-color: #fff; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  textarea { resize: vertical; display: block; }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .out { display: block; background: var(--calc); border: 1px solid var(--calc-line); border-radius: 6px; padding: 5px 6px; min-height: 30px; text-align: center; font-weight: 700; }

  .btn { cursor: pointer; background: #fff; color: var(--accent); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { color: #9b2c1c; border-color: #d9b1a8; }

  /* personaggi salvati, confronto, finestre di conferma */
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .char { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .char.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .char h3 { margin: 0; font: 600 18px var(--serif); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .char .meta { font-size: 13px; color: var(--muted); }
  .char .scores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
  .char .scores div { background: var(--field); border-radius: 6px; padding: 3px 0; font-size: 15px; font-weight: 600; }
  .char .scores small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: .03em; }
  .char .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; align-items: center; }
  .char .acts .btn { padding: 4px 9px; font-size: 12px; }
  .char .acts label { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); margin-left: auto; cursor: pointer; }
  .badge { display: inline-block; font: 600 11px var(--sans); padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.fav { background: #fbf0cf; color: #7a5600; }
  .cmp-wrap { overflow-x: auto; }
  table.vs { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
  table.vs th, table.vs td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: center; vertical-align: top; }
  table.vs th[scope=row] { text-align: left; font-family: var(--sans); font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; left: 0; background: var(--paper); min-width: 120px; }
  table.vs thead th { font: 600 16px var(--serif); vertical-align: bottom; color: var(--ink); }
  table.vs thead th .sub { display: block; font-family: var(--sans); }
  table.vs thead th.fav { box-shadow: inset 0 3px 0 #c99a1d; background: #fffaf0; }
  table.vs td.best { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  table.vs td.txt { text-align: left; font-size: 12px; }
  table.vs tr.grp th { text-align: left; background: var(--bg); font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); position: static; }
  table.vs tr.tot td { font-weight: 700; font-size: 15px; }
  .modal { position: fixed; inset: 0; background: rgba(30, 20, 15, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
  .modal .dlg { background: var(--paper); border-radius: 12px; padding: 18px 20px; max-width: 440px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  .modal .dlg p { margin: 0 0 14px; }
  .modal .dlg.wide { max-width: 980px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .modal .dlg .pv { overflow: auto; margin-top: 14px; border-top: 1px solid rgba(0, 0, 0, .12); padding-top: 10px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 110; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
  @media print { .toast, .modal { display: none !important; } }
  .btn.ghost { border-color: var(--line-strong); color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on { background: var(--ink); color: #fff; }

  /* spiegazioni */
  .help { display: inline-block; position: relative; vertical-align: middle; }
  .help > summary { list-style: none; cursor: pointer; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 11px/17px var(--sans); text-align: center; text-transform: none; letter-spacing: 0; }
  .help > summary::-webkit-details-marker { display: none; }
  .help[open] > summary { background: var(--accent-dark); }
  .help > div { position: absolute; z-index: 40; top: 22px; left: -10px; width: min(340px, 80vw); background: var(--hint-bg); border: 1px solid var(--hint-line); border-radius: 8px; padding: 9px 11px; font: 400 13px/1.45 var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; box-shadow: 0 6px 18px rgba(0,0,0,.16); }
  .hint { font-size: 12.5px; color: #5d4f45; background: var(--hint-bg); border-left: 3px solid var(--hint-line); padding: 6px 9px; margin-top: 6px; border-radius: 0 6px 6px 0; }
  .hint b { color: var(--ink); }
  .pg { display: inline-block; white-space: nowrap; font: 600 11px var(--sans); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; margin-left: 2px; vertical-align: 1px; }
  .warn { color: var(--warn); font-size: 12.5px; margin-top: 4px; }
  .okmsg { color: var(--ok); font-size: 12.5px; }
  body.nohelp .hint, body.nohelp .help { display: none !important; }

  /* ---------------- schede di scelta ---------------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
  .cards.small { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 13px; cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; }
  .card:hover { border-color: var(--line-strong); box-shadow: 0 4px 14px rgba(60, 40, 20, .1); transform: translateY(-1px); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card.dis { cursor: default; opacity: .78; }
  .card.dis:hover { transform: none; box-shadow: none; border-color: var(--line); }
  .card .tick { position: absolute; top: -10px; right: 10px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 9px; }
  .c-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .c-name { font: 600 18px/1.15 var(--serif); }
  .c-en { font-size: 12px; color: var(--muted); }
  .c-desc { margin: 0; font-size: 13px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: auto; }
  .facts span, .chip { background: var(--field); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: #4b3f37; }
  .chip.prim, .facts span.prim { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .kv { font-size: 12.5px; }
  .kv b { color: var(--muted); font-weight: 600; }
  .star { font-size: 11px; font-weight: 700; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .diff { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .diff.low { background: var(--ok-bg); color: var(--ok); }
  .diff.mid { background: #fdf3df; color: #8a5a00; }
  .diff.high { background: var(--accent-soft); color: var(--accent); }
  .flist { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .flist li { padding: 1px 0; }
  .flist b { display: inline-block; min-width: 26px; color: var(--muted); }

  .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; height: 70px; align-items: end; margin: 4px 0 2px; }
  .bar { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar .bf { width: 100%; max-width: 28px; background: #d9cdc0; border-radius: 3px 3px 0 0; }
  .bar.prim .bf { background: var(--accent); }
  .bar .bv { font-size: 11px; font-weight: 700; color: var(--muted); }
  .bar.prim .bv { color: var(--accent); }
  .bar .bl { font-size: 10px; color: var(--muted); border-top: 1px solid var(--line); width: 100%; text-align: center; padding-top: 1px; }

  .chosen { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 16px; align-items: start; }
  .chosen .card { cursor: default; }
  .chosen .card:hover { transform: none; }
  .chosen-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

  table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.cmp th, table.cmp td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.cmp thead th { position: sticky; top: 0; background: var(--paper); font: 600 11px var(--sans); text-transform: uppercase; color: var(--muted); letter-spacing: .03em; border-bottom: 2px solid var(--line-strong); }
  table.cmp tbody tr { cursor: pointer; }
  table.cmp tbody tr:hover { background: #fbf6f1; }
  table.cmp tbody tr.sel { background: var(--accent-soft); }
  table.cmp tbody th { font: 600 15px var(--serif); white-space: nowrap; }
  table.cmp td.num, table.cmp th.num { text-align: center; width: 44px; }
  .heat { font-weight: 700; text-align: center; border-radius: 4px; }
  .h8 { background: #f7f2ec; color: #9b8d81; } .h10 { background: #f1e6dc; color: #8a7a6d; } .h12 { background: #e9d3c5; color: #6d5444; }
  .h13 { background: #e0bfae; color: #5a3c2c; } .h14 { background: #cf9686; color: #3e1d12; } .h15 { background: #a33d32; color: #fff; }
  .heat.prim { box-shadow: inset 0 0 0 2px var(--accent); }

  /* dettaglio classe */
  dl.facts-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin: 10px 0 0; font-size: 13.5px; }
  dl.facts-grid dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
  dl.facts-grid dd { margin: 0; }
  details.prog { margin-top: 12px; }
  details.prog > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  table.prog { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  table.prog td, table.prog th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.prog tr.now { background: var(--accent-soft); font-weight: 600; }
  table.prog tr.past { color: var(--ink); }
  table.prog tr.future { color: var(--muted); }

  /* allineamento */
  .align { display: grid; grid-template-columns: 110px repeat(3, 1fr); gap: 10px; align-items: stretch; }
  .align .ax { display: flex; align-items: center; justify-content: center; font: 600 14px var(--serif); color: var(--muted); text-align: center; }

  /* caratteristiche */
  .builder table { width: 100%; border-collapse: collapse; }
  .builder th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; text-align: center; padding: 6px 4px; letter-spacing: .03em; }
  .builder th:first-child { text-align: left; }
  .builder td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: center; }
  .builder td:first-child { text-align: left; }
  .builder td.ab-name b { font: 600 16px var(--serif); }
  .builder td.tot .out { font-size: 17px; }
  .ctrl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
  .rolls { display: inline-flex; gap: 4px; margin-left: 6px; }
  .rolls span { background: var(--calc); border: 1px solid var(--calc-line); border-radius: 4px; padding: 1px 7px; font-weight: 700; }
  .abil-guide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ag { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .ag h3 { font-size: 16px; display: flex; justify-content: space-between; }
  .ag h3 span { font: 700 15px var(--sans); color: var(--accent); }
  .ag p { margin: 4px 0; font-size: 12.5px; }

  /* dettagli */
  .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .subnav a { text-decoration: none; font-size: 12.5px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 3px 11px; }
  .subnav a.done { border-color: #a9cfb0; background: var(--ok-bg); color: var(--ok); }
  .subnav a.todo { border-color: #ecc89a; background: #fff6e8; color: var(--warn); }
  .srcblock { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .srcblock:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 6px; }
  .feat-list { display: grid; gap: 8px; }
  .feat { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 10px; }
  .feat .fn { font-weight: 600; }
  .feat .fn small { font-weight: 400; color: var(--muted); }
  .feat .fd { font-size: 13px; color: #463a33; }
  .feat.sub { border-left-color: #7b65a8; }
  .feat.choice { border-left-color: var(--accent); background: #fdf7f5; padding: 8px 10px; border-radius: 0 8px 8px 0; }
  .lvl-head { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 4px; }
  .cols { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-bottom: 6px; }
  .cols b { color: var(--accent); }
  .counters { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 13px; }
  .counters b { font-size: 15px; }
  .spellcast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  table.spells { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.spells th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; text-align: left; padding: 4px; border-bottom: 2px solid var(--line-strong); }
  table.spells td { padding: 5px 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.spells th.cb, table.spells td.cb { text-align: center; width: 22px; }
  table.spells tr.auto td:first-child { color: var(--accent); font-weight: 700; }
  table.spells .sdesc { font-size: 12.5px; color: #4e4139; }
  .row-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 17px; padding: 0 4px; }
  .row-del:hover { color: var(--accent); }
  .add-row { margin-top: 10px; cursor: pointer; background: none; color: var(--accent); border: 1px dashed var(--line-strong); border-radius: 7px; padding: 6px 12px; font-size: 13px; }
  .yes { color: var(--accent); font-weight: 700; }
  .pack { font-size: 13px; margin-top: 4px; }

  .nextbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .nextbar .st { font-size: 13px; color: var(--muted); text-align: center; }

  /* ---------------- scheda finale ---------------- */
  .sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 22px 24px 24px; margin-bottom: 18px; }
  .sh-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 14px; }
  .sh-name { font: 600 30px/1.1 var(--serif); color: var(--accent); }
  .sh-line { font-size: 14px; margin-top: 3px; }
  .sh-line .sub { font-size: 13px; }
  .sh-meta { display: flex; gap: 14px; align-items: flex-end; }
  .sh-meta label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .sh-meta .insp { flex-direction: row; align-items: center; gap: 6px; text-transform: none; font-size: 13px; color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 8px 6px 7px; text-align: center; }
  .tile .v { font: 700 26px/1.1 var(--sans); }
  .tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .k { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-weight: 700; margin-top: 2px; }
  .tile.ac .v { width: 58px; height: 62px; margin: 0 auto; display: grid; place-items: center; border: 2px solid var(--accent); border-radius: 10px 10px 30px 30px; }
  .sh-cols { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  .sh-abil { display: grid; gap: 8px; }
  .ab { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 8px 10px; }
  .ab-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .ab-head h3 { font-size: 15px; color: var(--accent); }
  .ab-score { display: flex; align-items: center; gap: 6px; }
  .ab-score .mod { font: 700 20px var(--sans); }
  .ab-score .sc { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .sk { display: grid; grid-template-columns: 14px 14px 34px 1fr; gap: 6px; align-items: center; font-size: 13px; padding: 1px 0; }
  .sk .b { font-weight: 700; text-align: right; }
  .sk.ts { font-weight: 600; border-bottom: 1px dashed var(--line); padding-bottom: 3px; margin-bottom: 2px; }
  .dot { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--line-strong); border-radius: 50%; background: #fff; }
  .dot.on { background: var(--accent); border-color: var(--accent); }
  .dot.exp { border-radius: 2px; transform: rotate(45deg) scale(.82); }
  .box { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 10px 12px; }
  .box h3 { font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .sh-main { display: grid; gap: 12px; }
  .sh-row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  .hp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .death { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 6px; }
  .death span { display: inline-flex; gap: 4px; align-items: center; }
  table.weapons { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.weapons th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; text-align: left; padding: 4px; border-bottom: 2px solid var(--line-strong); }
  table.weapons td { padding: 5px 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.weapons td.b { font-weight: 700; white-space: nowrap; }
  .wnote { font-size: 12px; color: var(--muted); }
  .wsub { font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .wsub b { color: var(--ink); }
  table.spells td.nw { white-space: nowrap; }
  table.spells .sname .en { font-size: 11px; color: var(--muted); }
  .pgp { color: var(--muted); white-space: nowrap; }
  table.spells .how { margin-top: 3px; color: var(--ink); }
  table.spells .how b { font-weight: 700; }
  .compact .feat { padding-top: 0; padding-bottom: 0; }
  .compact .feat .fd { font-size: 12.5px; }
  .sh-text { white-space: pre-wrap; font-size: 13px; min-height: 40px; }
  .slots { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; text-align: center; }
  .slots .lv { font-size: 11px; color: var(--accent); font-weight: 700; }
  .slots .ticks { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 4px; min-height: 16px; }
  .coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
  .coins .lv { font-size: 11px; color: var(--accent); font-weight: 700; }
  .coins input { text-align: center; padding: 5px 2px; }
  .attune { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: center; margin-top: 6px; }
  .sheet.p2 .sh-cols { grid-template-columns: 1fr 320px; }
  .side-grid { display: grid; gap: 12px; align-content: start; }
  .print-only { display: none; }

  @media screen and (max-width: 1000px) {
    .tiles { grid-template-columns: repeat(3, 1fr); }
    .sh-cols, .sh-row2, .two, .chosen { grid-template-columns: 1fr; }
    .abil-guide { grid-template-columns: 1fr 1fr; }
    .ctrl { grid-template-columns: 1fr; }
    .slots { grid-template-columns: repeat(5, 1fr); }
  }
  @media screen and (max-width: 600px) {
    body { font-size: 15px; }
    .wrap { padding: 14px 12px 30px; }
    .toolbar { padding: 8px 12px; }
    .stepnav .in { padding: 6px 12px; }
    .pill .s { display: none; }
    .panel { padding: 14px; }
    .intro h1 { font-size: 22px; }
    .intro .big-n { width: 38px; height: 38px; font-size: 18px; }

    dl.facts-grid { grid-template-columns: 1fr; gap: 2px; }
    dl.facts-grid dd { margin-bottom: 6px; }
    .sheet { padding: 14px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .slots { grid-template-columns: repeat(3, 1fr); }

    table.weapons, table.spells, .builder table, table.cmp { min-width: 560px; }
  }

  @page { size: A4; margin: 8mm; }
  @media print {
    body { background: #fff; font-size: 9.5px; line-height: 1.3; }
    .toolbar, .stepnav, .hint, .help, .btn, .noprint, .add-row, .row-del, .screen-only { display: none !important; }
    .print-only { display: block; }
    .wrap { max-width: none; padding: 0; }
    .tab { display: none !important; }
    #tab-scheda { display: block !important; }

    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet { box-shadow: none; border: 0; padding: 0; margin: 0; }
    .sheet + .sheet { break-before: page; }
    .sh-head { padding-bottom: 5px; margin-bottom: 8px; }
    .sh-name { font-size: 22px; }
    .sh-line { font-size: 11px; }
    .tiles { grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
    .tile { padding: 4px; }
    .tile .v { font-size: 17px; }
    .tile .k { font-size: 8px; }
    .tile.ac .v { width: 42px; height: 44px; border-radius: 8px 8px 22px 22px; }
    .sh-cols, .sheet.p2 .sh-cols { grid-template-columns: 200px 1fr; gap: 10px; }

    .sh-abil { gap: 5px; }
    .ab { padding: 4px 7px; }
    .ab-head { margin-bottom: 2px; }
    .ab-head h3 { font-size: 11.5px; }
    .ab-score .mod { font-size: 14px; }
    .sk { font-size: 9.5px; grid-template-columns: 9px 9px 24px 1fr; gap: 4px; padding: 0; }
    .dot { width: 9px; height: 9px; border-width: 1px; }
    .sh-main { gap: 7px; }
    .sh-row2 { grid-template-columns: 1.3fr 1fr; gap: 7px; }
    .box { padding: 5px 8px; break-inside: auto; }
    .ab, .tile, .sh-row2 { break-inside: avoid; }
    .box h3 { font-size: 11.5px; margin-bottom: 3px; }
    .lbl { font-size: 8px; margin-bottom: 1px; }
    input[type=text], select, .out { padding: 2px 4px; min-height: 0; font-size: 9.5px; }
    .out { font-size: 11px; }
    select { -webkit-appearance: none; appearance: none; background: #fff; border-color: var(--line); }
    textarea { display: none; }
    .feat-list { gap: 3px; }
    .feat { padding-left: 6px; }
    .feat .fd, .compact .feat .fd { font-size: 8.5px; }
    .cols { font-size: 9px; margin-bottom: 3px; }
    table.weapons, table.spells { font-size: 9px; }
    table.weapons td, table.spells td, table.weapons th, table.spells th { padding: 2px 3px; }
    table.spells .sdesc { font-size: 8.5px; }
    .spellcast { gap: 6px; }
    .slots { grid-template-columns: repeat(9, 1fr); }
    .coins { gap: 4px; }
    table.weapons tr.empty { display: none; }

    table.weapons th:nth-child(1) { width: 30% !important; }
    table.weapons th:nth-child(2) { width: 20% !important; }

  }

false},"concentration":true,"ritual":false,"duration":"Fino a 1 minuto","desc":"Attacco con incantesimo a distanza: 2d12 danni da fulmine; poi 1d12 automatico ogni turno con azione bonus.","higher":"+1d12 ai danni iniziali per ogni livello di slot sopra il 1°.","page":343},{"id":"word-of-radiance","en":"Word of Radiance","it":"Parola Radiosa","level":0,"school":"Invocazione","classes":["cleric"],"time":"Azione","range":"Personale","components":{"v":true,"s":false,"m":"un simbolo solare","mCost":false},"concentration":false,"ritual":false,"duration":"Istantanea","desc":"Creature a scelta entro 5 piedi (1,5 m) da te: TS Costituzione o 1d6 danni radiosi.","higher":"2d6 al 5° livello, 3d6 all'11°, 4d6 al 17°.","page":343},{"id":"word-of-recall","en":"Word of Recall","it":"Parola del Ritiro","level":6,"school":"Evocazione","classes":["cleric"],"time":"Azione","range":"5 piedi (1,5 m)","components":{"v":true,"s":false,"m":null,"mCost":false},"concentration":false,"ritual":false,"duration":"Istantanea","desc":"Teletrasporta te e fino a 5 creature vicine in un santuario che hai preparato in precedenza.","higher":null,"page":343},{"id":"wrathful-smite","en":"Wrathful Smite","it":"Punizione Collerica","level":1,"school":"Necromanzia","classes":["paladin"],"time":"Azione bonus (dopo aver colpito in mischia)","range":"Personale","components":{"v":true,"s":false,"m":null,"mCost":false},"concentration":false,"ritual":false,"duration":"1 minuto","desc":"+1d6 danni necrotici al colpo; TS Saggezza o Spaventato, ripete il TS a fine di ogni turno.","higher":"+1d6 danni per ogni livello di slot sopra il 1°.","page":343},{"id":"yolandes-regal-presence","en":"Yolande's Regal Presence","it":"Presenza Regale di Yolande","level":5,"school":"Ammaliamento","classes":["bard","wizard"],"time":"Azione","range":"Personale","components":{"v":true,"s":true,"m":"una piccola tiara","mCost":false},"concentration":true,"ritual":false,"duration":"Fino a 1 minuto","desc":"Aura di 10 piedi (3 m): TS Saggezza o 4d6 danni psichici, Prono e spinto; metà se riesce.","higher":null,"page":343},{"id":"zone-of-truth","en":"Zone of Truth","it":"Zona di Verità","level":2,"school":"Ammaliamento","classes":["bard","cleric","paladin"],"time":"Azione","range":"60 piedi (18 m)","components":{"v":true,"s":true,"m":null,"mCost":false},"concentration":false,"ritual":false,"duration":"10 minuti","desc":"Sfera di 15 piedi (4,5 m): chi fallisce il TS Carisma non può mentire deliberatamente; sai chi ha fallito.","higher":null,"page":343}],"spellRules":[{"en":"Preparing Spells","it":"Preparare incantesimi","desc":"Per lanciare un incantesimo devi averlo preparato. Bardo, Paladino, Ranger, Stregone e Warlock cambiano un incantesimo quando salgono di livello o dopo un Riposo lungo; Chierico, Druido e Mago possono cambiarli tutti dopo un Riposo lungo.","page":235},{"en":"Always-Prepared Spells","it":"Incantesimi sempre preparati","desc":"Alcuni privilegi ti danno incantesimi sempre preparati: non contano nel numero di incantesimi che puoi preparare.","page":235},{"en":"Casting in Armor","it":"Lanciare in armatura","desc":"Puoi lanciare incantesimi indossando un'armatura solo se hai l'addestramento per quel tipo di armatura.","page":235},{"en":"Spell Level","it":"Livello dell'incantesimo","desc":"Ogni incantesimo ha un livello da 0 a 9 che ne indica la potenza. I trucchetti sono di livello 0.","page":235},{"en":"Spell Slots","it":"Slot incantesimo","desc":"Gli incantesimi di livello 1 o più consumano uno slot di quel livello o superiore. Il numero di slot dipende da classe e livello; un Riposo lungo li recupera tutti.","page":235},{"en":"Cantrips","it":"Trucchetti","desc":"Incantesimi di livello 0: si lanciano a volontà, senza spendere slot.","page":235},{"en":"Rituals","it":"Rituali","desc":"Gli incantesimi con l'etichetta Rituale, se li hai preparati, si possono lanciare senza slot impiegando 10 minuti in più del normale.","page":235},{"en":"Using a Higher-Level Spell Slot","it":"Usare uno slot di livello superiore","desc":"Se lanci un incantesimo con uno slot più alto, l'incantesimo sale a quel livello; molti diventano più forti, come indicato nella loro descrizione.","page":236},{"en":"Cantrip Upgrade","it":"Potenziamento dei trucchetti","desc":"Molti trucchetti diventano più forti quando il personaggio raggiunge i livelli 5, 11 e 17, di solito con un dado di danno in più a ogni soglia.","page":239},{"en":"School of Magic","it":"Scuola di magia","desc":"Ogni incantesimo appartiene a una di otto scuole (Abiurazione, Ammaliamento, Divinazione, Evocazione, Illusione, Invocazione, Necromanzia, Trasmutazione). Servono a descriverlo, non hanno regole proprie.","page":236},{"en":"Class Spell Lists","it":"Liste di incantesimi per classe","desc":"Tra parentesi, dopo la scuola, sono indicate le classi che hanno l'incantesimo nella loro lista.","page":236},{"en":"Casting Time","it":"Tempo di lancio","desc":"Quasi tutti gli incantesimi richiedono l'azione Magia; alcuni un'Azione bonus, una Reazione (con un innesco preciso) o 1 minuto o più.","page":236},{"en":"One Spell with a Spell Slot per Turn","it":"Un solo slot per turno","desc":"In un turno puoi spendere un solo slot incantesimo: non puoi lanciare due incantesimi con slot, per esempio uno con l'azione e uno con l'Azione bonus.","page":236},{"en":"Longer Casting Times","it":"Tempi di lancio lunghi","desc":"Per incantesimi da 1 minuto o più devi usare l'azione Magia ogni turno e mantenere la Concentrazione; se la perdi l'incantesimo fallisce ma lo slot non si spende.","page":236},{"en":"Range","it":"Gittata","desc":"La distanza massima a cui l'incantesimo può avere origine: un numero di piedi, Contatto (devi toccare il bersaglio) o Personale (parte da te).","page":236},{"en":"Components","it":"Componenti","desc":"Requisiti per lanciare: V (Verbale, parlare ad alta voce), S (Somatica, gesti con almeno una mano libera), M (Materiale, un oggetto). Senza una componente non puoi lanciare.","page":236},{"en":"Material (M)","it":"Materiale (M)","desc":"Se il materiale non ha un costo e non viene consumato puoi usare una borsa delle componenti o un focus da incantatore; quelli con un prezzo in mo vanno procurati davvero.","page":237},{"en":"Duration","it":"Durata","desc":"Quanto dura l'effetto: Istantanea, un tempo preciso (round, minuti, ore) oppure Concentrazione. Puoi terminare in anticipo un incantesimo in corso quando vuoi.","page":237},{"en":"Concentration","it":"Concentrazione","desc":"Gli incantesimi con Concentrazione durano finché resti concentrato, fino al massimo indicato. Puoi concentrarti su un solo incantesimo alla volta; i danni possono farti perdere la concentrazione.","page":237},{"en":"Targets and Areas of Effect","it":"Bersagli e aree d'effetto","desc":"Per colpire un bersaglio serve una linea libera (niente copertura totale). Le aree hanno forma di Cono, Cubo, Cilindro, Emanazione, Linea o Sfera.","page":238},{"en":"Saving Throws","it":"Tiri salvezza","desc":"Molti incantesimi chiedono al bersaglio un tiro salvezza. CD = 8 + modificatore della caratteristica da incantatore + bonus di competenza.","page":238},{"en":"Attack Rolls","it":"Tiri per colpire","desc":"Alcuni incantesimi richiedono un tiro per colpire. Modificatore = modificatore della caratteristica da incantatore + bonus di competenza.","page":238},{"en":"Combining Spell Effects","it":"Combinare effetti","desc":"Incantesimi diversi si sommano; lo stesso incantesimo lanciato più volte sullo stesso bersaglio non si somma: vale solo l'effetto più forte.","page":238}]};</script>

  const HELP = {
    nome: ['Il nome del personaggio: scegli quello che preferisci. Può avere un significato per la sua storia o la sua famiglia.', 41],
    classe: ['È la scelta più importante: decide cosa sa fare il personaggio (combattere, curare, lanciare incantesimi…). Accanto a ogni classe c\'è la difficoltà di gioco: per un primo personaggio Guerriero e Ladro sono le più semplici. Le classi sono descritte nel capitolo 3.', 33],
    livello: ['Misura l\'esperienza del personaggio, da 1 a 20. Di solito si parte dal 1°: chiedi al DM. Quando cambi livello la scheda aggiorna da sola punti ferita, bonus, privilegi e incantesimi.', 41],

    background: ['Cosa faceva il personaggio prima di diventare avventuriero. Ti dà: +3 punti nelle caratteristiche, competenza in 2 abilità e in 1 strumento, un talento di origine e dell\'equipaggiamento.', 36],

    caratteristiche: ['Sei numeri che descrivono il personaggio. Il punteggio va di solito da 8 a 15 all\'inizio (massimo 20). Da ogni punteggio si ricava il modificatore, il numero che aggiungi ai tiri di dado.', 38],
    metodo: ['Tre modi per ottenere i sei numeri: la serie standard (sicura e veloce, consigliata), l\'acquisto a punti (27 punti da spendere) o il tiro di dadi (4d6 tenendo i 3 più alti, sei volte). Il DM può chiederti di usarne uno in particolare.', 38],
    bg_bonus: ['Il background elenca tre caratteristiche: puoi dare +2 a una e +1 a un\'altra, oppure +1 a tutte e tre. Nessun punteggio può superare 20 con questi aumenti. Consiglio: alza la caratteristica principale della classe.', 38],
    competenza: ['Un bonus che rappresenta l\'addestramento. Si aggiunge ai tiri in cui sei competente: abilità, tiri salvezza, armi, strumenti e incantesimi. Cresce con il livello: +2 dal 1° al 4°, poi +3, +4, +5, +6.', 13],
    iniziativa: ['Decide l\'ordine dei turni all\'inizio di un combattimento: tiri 1d20 e aggiungi questo numero. È il modificatore di Destrezza (più il bonus di competenza con il talento Allerta).', 41],
    velocita: ['Quanti piedi puoi muoverti nel tuo turno (5 piedi = 1,5 m = un quadretto). Dipende dalla specie; alcuni privilegi la aumentano.', 374],

    pp: ['Percezione passiva: il DM la usa per sapere se noti qualcosa senza cercarlo apposta. È 10 + il tuo bonus di Saggezza (Percezione).', 40],
    ispirazione: ['Il DM te la dà quando fai qualcosa di eroico o divertente. Spendila per ritirare un dado subito dopo averlo tirato. Ne puoi avere una sola alla volta. Gli umani la ottengono a ogni riposo lungo.', 13],
    ca: ['Classe Armatura: quanto è difficile colpirti. Un attacco ti colpisce se il suo tiro è uguale o superiore. Senza armatura è 10 + modificatore di Destrezza; l\'armatura e lo scudo la cambiano.', 41],
    pf: ['Punti ferita: quanti danni puoi subire. A 0 cadi a terra privo di sensi. I massimi si calcolano da classe e Costituzione; negli «Attuali» scrivi i PF che ti restano durante il gioco; i «Temporanei» sono un cuscinetto che si perde per primo.', 40],
    dv: ['Dadi vita: durante un riposo breve puoi tirarne alcuni per recuperare PF (dado + modificatore di Costituzione). Ne hai uno per livello e li recuperi tutti con un riposo lungo.', 41],
    morte: ['Se inizi il turno a 0 PF tiri 1d20: con 10 o più segni un successo, sotto 10 un fallimento. 3 successi: ti stabilizzi. 3 fallimenti: muori. Un 20 naturale ti fa tornare a 1 PF.', 365],
    ts: ['Il tiro salvezza serve a evitare un pericolo (veleno, esplosione, magia mentale). Tiri 1d20 + il modificatore della caratteristica, + la competenza se la classe te la dà in quel tiro salvezza.', 11],
    abilita: ['Le abilità sono campi in cui puoi essere addestrato. Quando il DM chiede una prova (es. Saggezza – Percezione) tiri 1d20 + il numero accanto all\'abilità. Il pallino pieno indica la competenza: aggiungi il bonus di competenza.', 14],
    maestria: ['Maestria: in un\'abilità in cui sei già competente il bonus di competenza si raddoppia. La danno alcune classi (Ladro, Bardo, Ranger, Mago) e alcuni talenti.', 367],
    armi: ['Scegli le armi che porti: la scheda calcola il bonus per colpire (modificatore + competenza se sei addestrato) e i danni. Mischia usa la Forza, distanza la Destrezza; le armi «Accurate» usano la migliore delle due.', 41],
    privilegi: ['I poteri che la classe ti dà a ogni livello. Qui compaiono da soli quelli del tuo livello; dove c\'è un menu devi fare una scelta.', 47],
    tratti: ['Le capacità speciali della tua specie (scurovisione, resistenze, piccoli incantesimi…). Compaiono da sole.', 186],
    talenti: ['I talenti sono capacità extra. Ne ricevi uno dal background; altri ai livelli 4, 8, 12, 16 (al posto dell\'aumento dei punteggi) e un Dono epico al 19°.', 199],
    addestramento: ['Cosa sai usare: armature, armi e strumenti. Indossare un\'armatura senza addestramento dà svantaggio su Forza e Destrezza e ti impedisce di lanciare incantesimi.', 361],
    lingue: ['Conosci il Comune più due lingue standard a scelta. Le lingue rare si scelgono solo con il permesso del DM. Alcune classi e talenti ne aggiungono altre.', 37],
    incantesimi: ['Se la tua classe lancia incantesimi: i trucchetti si usano quando vuoi; gli altri incantesimi consumano uno «slot». Ogni giorno prepari un certo numero di incantesimi dalla lista della tua classe.', 41],
    slot: ['Gli slot sono le «cariche» per lanciare incantesimi di 1° livello o superiore. Spunta una casella quando ne usi uno; si recuperano tutti con un riposo lungo (il Warlock li recupera anche con un riposo breve).', 41],
    equip: ['La classe e il background ti offrono ciascuno un pacchetto di oggetti oppure delle monete d\'oro per comprare ciò che vuoi. Scegli le opzioni e premi «Applica» per compilare armatura, armi e monete.', 36],
    monete: ['Le monete del personaggio. All\'inizio arrivano dalle opzioni di equipaggiamento scelte.', 213],
