    storia: ['Chi è il personaggio: carattere, legami, paure, obiettivi. Non serve scrivere un romanzo: bastano poche frasi da usare quando lo interpreti.', 40]
  };

  // ------------------------------------------------------------------ utilità
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
  const byId = (arr, id) => (arr || []).find(x => x.id === id) || null;
  const nm = o => !o ? '' : (o.it && o.en && norm(o.it) !== norm(o.en) ? `${o.it} (${o.en})` : (o.it || o.en || ''));
  const sign = n => n == null || isNaN(n) ? '—' : (n >= 0 ? '+' + n : String(n));
  const modOf = s => s == null ? null : Math.floor((s - 10) / 2);
  const pg = p => p ? `<span class="pg" title="Player's Handbook 2024 (ed. inglese), pagina ${p}">PHB p. ${p}</span>` : '';
  const hint = html => html ? `<div class="hint">${html}</div>` : '';
  const warn = html => html ? `<div class="warn">⚠ ${html}</div>` : '';
  const help = key => { const h = HELP[key]; return h ? `<details class="help"><summary title="Spiegazione">?</summary><div>${esc(h[0])} ${pg(h[1])}</div></details>` : ''; };
  const ord = n => n + '°';
  const ftm = s => s ? String(s).replace(/(\d+)\s*(?:ft\.?|feet|piedi)(?!\s*\()/gi, (m, n) => `${n} piedi (${(n * 0.3).toFixed(n * 0.3 % 1 ? 1 : 0).replace('.', ',')} m)`) : '';

  function selectHTML(key, opts, o = {}) {
    const cur = S[key] == null ? '' : String(S[key]);
    let h = `<select data-k="${key}"${o.dis ? ' disabled' : ''}${o.title ? ` title="${esc(o.title)}"` : ''}>`;
    if (o.ph !== false) h += `<option value="">${esc(o.ph || '— scegli —')}</option>`;
    let group = null;
    opts.forEach(op => {
      if (op.g !== undefined && op.g !== group) { if (group !== null) h += '</optgroup>'; group = op.g; h += `<optgroup label="${esc(op.g)}">`; }
      const v = String(op.v);
      h += `<option value="${esc(v)}"${v === cur ? ' selected' : ''}${op.dis && v !== cur ? ' disabled' : ''}>${esc(op.t)}</option>`;
    });
    if (group !== null) h += '</optgroup>';
    return h + '</select>';
  }
  const field = (label, helpKey, control, extra = '', cls = '') =>
    `<div class="${cls}"><span class="lbl">${label} ${help(helpKey)}</span>${control}${extra}</div>`;

  // ------------------------------------------------------------------ indici dati
  const EQ = D.equipment || {};
  const ITEM = {};
  [['weapon', EQ.weapons], ['armor', EQ.armor], ['tool', EQ.tools], ['gear', EQ.gear]].forEach(([kind, arr]) => (arr || []).forEach(x => {
    const it = Object.assign({ kind }, x);
    ITEM[norm(x.en)] = ITEM[norm(x.en)] || it;
    (Array.isArray(x.aka) ? x.aka : x.aka ? [x.aka] : []).forEach(a => { ITEM[norm(a)] = ITEM[norm(a)] || it; });
  }));
  // Oggetti citati nei pacchetti con un nome diverso da quello della tabella dell'equipaggiamento
  const EXTRA_ITEMS = {
    'crystal': 'Cristallo (focus arcano)', 'orb': 'Globo (focus arcano)', 'rod': 'Verga (focus arcano)', 'wand': 'Bacchetta (focus arcano)',
    'spellbook': 'Libro degli incantesimi', "artisan's tools": 'Strumenti da artigiano (a scelta)', 'musical instrument': 'Strumento musicale (a scelta)', 'gaming set': 'Set da gioco (a scelta)'
  };
  const itemByEn = en => {
    const n = norm(en);
    const flip = n.includes(' ') && !n.includes(',') ? n.replace(/^(.*) (\S+)$/, '$2, $1') : '';
    const found = ITEM[n] || ITEM[n.replace(/es$/, '')] || ITEM[n.replace(/s$/, '')] || (flip && ITEM[flip]);
    if (found) return found;
    return EXTRA_ITEMS[n] ? { kind: 'other', en, it: EXTRA_ITEMS[n] } : null;
  };
  const PROP = Object.fromEntries((EQ.weaponProperties || []).map(p => [norm(p.en), p]));
  const MAST = Object.fromEntries((EQ.masteryProperties || []).map(p => [norm(p.en), p]));
  const SPELL = {};
  (D.spells || []).forEach(s => { SPELL[s.id] = s; SPELL[norm(s.en)] = SPELL[norm(s.en)] || s; });
  const spellByEn = en => SPELL[norm(en)] || null;
  const FEAT = {};
  (D.feats || []).forEach(f => { FEAT[f.id] = f; FEAT[norm(f.en)] = f; });
  const featByEn = en => FEAT[norm(en)] || FEAT[norm(String(en || '').replace(/\s*\(.*\)\s*$/, ''))] || null;
  const SIZE_IT = { tiny: 'Minuscola', small: 'Piccola', medium: 'Media', large: 'Grande' };
  const sizeIt = s => SIZE_IT[norm(s)] || s;

  // ------------------------------------------------------------------ stato
  // Più personaggi: STORE = { cur, preferito, chars: { id: { S, upd } } }. S è sempre il personaggio aperto.
  // Si salva nel browser; nella pagina su claude.ai anche nell'account dell'utente (db), per ritrovarlo su altri dispositivi.
  const STORE_KEY = 'scheda-dnd-2024-v3';
  const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function'); // pagina pubblicata su claude.ai: niente stampa diretta né download liberi
  const PRINT_HINT = IN_CLAUDE ? '«Scarica la scheda stampabile» ti dà un file da aprire nel browser e stampare, o salvare in PDF, su 2 pagine A4.' : '«Stampa la scheda» la stampa su 2 pagine A4; «Scarica la scheda stampabile» ne salva una copia da stampare quando vuoi.';
  const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const isBlank = s => !s || !(s.classe || s.nome || s.specie || s.background);
  let STORE = null, migrated = false;
  try { STORE = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { STORE = null; }
  if (!STORE || typeof STORE.chars !== 'object' || !STORE.chars) {
    STORE = { cur: null, preferito: null, chars: {} };
    let old = null;
    try { old = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { old = null; }
    if (old && typeof old === 'object' && !isBlank(old)) { const id = newId(); STORE.chars[id] = { S: old, upd: Date.now() }; STORE.cur = id; migrated = true; }
  }
  if (!STORE.cur || !STORE.chars[STORE.cur]) {
    const ids = Object.keys(STORE.chars).sort((a, b) => (STORE.chars[b].upd || 0) - (STORE.chars[a].upd || 0));
    if (ids.length) STORE.cur = ids[0];
    else { STORE.cur = newId(); STORE.chars[STORE.cur] = { S: {}, upd: Date.now() }; }
  }
  let S = STORE.chars[STORE.cur].S;
  const defaults = () => { if (!S.metodo) S.metodo = 'standard'; if (!S.livello) S.livello = '1'; if (!S.bg_modo) S.bg_modo = '21'; if (!S.incN) S.incN = 4; if (!S.eq_cls) S.eq_cls = 'A'; if (!S.eq_bg) S.eq_bg = 'A'; };
  defaults();

  let saveTimer, cloudTimer, localOk = true;
  let CLOUD = null; // { col } quando il salvataggio nell'account claude.ai è attivo
  const dirty = new Set(); // personaggi da scrivere (o cancellare) nel cloud
  let dirtyMeta = false, pushing = false;
  const statusEl = document.getElementById('status');
  const hhmm = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }
  function showSaved() {
    if (!localOk && !CLOUD) { setStatus('Non salvato qui: usa «Scarica salvataggio»', 'bad'); return; }
    setStatus(`Salvato ✓ ${hhmm(new Date())}${CLOUD ? ' · anche nel tuo account' : ''}`, 'ok');
  }
  function writeLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); localOk = true; } catch (e) { localOk = false; }
  }
  // Ogni modifica del personaggio aperto passa da qui
  function persist() {
    const ch = STORE.chars[STORE.cur];
    ch.S = S; ch.upd = Date.now();
    dirty.add(STORE.cur);
    saveAll();
  }
  // Salva tutto lo STORE (dopo modifiche, cambi di personaggio, cancellazioni)
  function saveAll() {
    clearTimeout(saveTimer);
    setStatus('Salvataggio…');
    saveTimer = setTimeout(() => { writeLocal(); showSaved(); }, 300);
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudPush, 1500);
  }
  async function cloudPush() {
    if (!CLOUD || pushing) return;
    pushing = true;
    try {
      while (dirty.size) {
        const id = dirty.values().next().value;
        dirty.delete(id);
        const ch = STORE.chars[id];
        if (ch) await CLOUD.col.doc(id).set({ json: JSON.stringify(ch.S), nome: ch.S.nome || '', upd: ch.upd || Date.now() });
        else await CLOUD.col.doc(id).delete();
      }
      if (dirtyMeta) { dirtyMeta = false; await CLOUD.col.doc('stato').set({ preferito: STORE.preferito || '' }); }
      showSaved();
    } catch (e) {
      CLOUD = null;
      showSaved();
    } finally { pushing = false; }
  }
  // Nella pagina su claude.ai: unisce i personaggi salvati nell'account con quelli di questo browser
  async function cloudInit() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid || (await user.can('data.write')) === false) return;
      const col = db.collection('data/users/' + uid);
      const snap = await col.get();
      const inCloud = new Map();
      let arrived = false;
      snap.docs.forEach(d => {
        const v = d.data() || {};
        if (d.id === 'stato') { if (v.preferito && !STORE.preferito) STORE.preferito = v.preferito; return; }
        let s; try { s = JSON.parse(v.json); } catch (e) { return; }
        if (!s || typeof s !== 'object') return;
        inCloud.set(d.id, v.upd || 0);
        const loc = STORE.chars[d.id];
        if (!loc || (v.upd || 0) > (loc.upd || 0)) { STORE.chars[d.id] = { S: s, upd: v.upd || 0 }; arrived = true; }
      });
      Object.keys(STORE.chars).forEach(id => {
        const ch = STORE.chars[id];
        if (isBlank(ch.S)) return;
        if (!inCloud.has(id) || (ch.upd || 0) > inCloud.get(id)) dirty.add(id);
      });
      if (STORE.preferito) dirtyMeta = true;
      // Se qui c'era solo una scheda vuota, apri il personaggio più recente dell'account
      if (arrived && isBlank(STORE.chars[STORE.cur].S)) {
        delete STORE.chars[STORE.cur];
        STORE.cur = Object.keys(STORE.chars).sort((a, b) => (STORE.chars[b].upd || 0) - (STORE.chars[a].upd || 0))[0];
      }
      CLOUD = { col };
      S = STORE.chars[STORE.cur].S; defaults();
      writeLocal();
      if (arrived) { renderAll(); toast('Personaggi recuperati dal tuo account ✓'); }
      await cloudPush();
      showSaved();
    } catch (e) { CLOUD = null; }
  }

  // ------------------------------------------------------------------ calcolo
  function baseVal(id) {
    const v = S['base_' + id];
    switch (S.metodo) {
      case 'standard': { const n = parseInt(v, 10); return STD.includes(n) ? n : null; }
      case 'punti': { const n = parseInt(v, 10); return n >= 8 && n <= 15 ? n : 8; }
      case 'dadi': { const m = /^r(\d)$/.exec(v || ''); const t = S.tiri || []; return m && t[+m[1]] != null ? t[+m[1]] : null; }
      default: { const n = parseInt(v, 10); return isNaN(n) ? null : Math.max(1, Math.min(30, n)); }
    }
  }
  const capAdd = (v, inc, max) => v == null ? null : (v >= max ? v : Math.min(max, v + inc));

  function abilityPrereqOk(req, sc) {
    if (!req) return true;
    const list = Array.isArray(req) ? req : [req];
    return list.every(r => {
      const min = r.min || 13;
      if (r.any) return r.any.some(a => (sc[a] || 0) >= min);
      if (r.all) return r.all.every(a => (sc[a] || 0) >= min);
      return Object.keys(r).filter(k => AB[k]).every(k => (sc[k] || 0) >= r[k]);
    });
  }

  function choiceCount(ch, R) {
    if (ch.countByLevel) {
      let n = 0;
      Object.keys(ch.countByLevel).forEach(k => { if (+k <= R.L) n = Math.max(n, ch.countByLevel[k]); });
      return n;
    }
    if (ch.count) return ch.count;
    const cols = R.row && R.row.columns || {};
    const words = norm(ch.en).split(' ').filter(w => w.length > 4);
    for (const k of Object.keys(cols)) {
      if (words.some(w => norm(k).includes(w.replace(/s$/, '')))) { const n = parseInt(cols[k], 10); if (!isNaN(n)) return n; }
    }
    return 1;
  }

  const SKIP_CHOICE = /fighting style|expertise|weapon mastery|ability score/i;
  function classChoices(R) {
    const out = [];
    const add = (list, src, maxLevel) => (list || []).forEach(ch => {
      if ((ch.level || 1) > maxLevel || SKIP_CHOICE.test(ch.en || '') || ch.grants || !Array.isArray(ch.options) || !ch.options.length) return;
      if (ch.options.every(o => SK[o.id])) return; // scelta di abilità: va nel riquadro Competenze
      const key = 'ch_' + src + '_' + norm(ch.en).replace(/[^a-z0-9]+/g, '') + (ch.level || 1);
      const n = Math.max(1, choiceCount(ch, R));
      const picked = [];
      for (let i = 0; i < n; i++) picked.push(byId(ch.options, S[key + '_' + i]));
      out.push({ ch, key, n, picked, src });
    });
    if (R.c) add(R.c.choices, 'c', R.L);
    if (R.sub) add(R.sub.choices, 's', R.L);
    return out;
  }

  function hasFightingStyle(R) {
    return R.features.some(f => (f.grants && f.grants.fightingStyle) || /^fighting style$/i.test(f.en || ''));
  }

  function featSlots(R, Gs) {
    const slots = [];
    const seen = new Set();
    const push = s => { if (!seen.has(s.key)) { seen.add(s.key); slots.push(s); } };
    if (R.bg && R.bg.feat) push({ key: 'bg', level: 0, label: 'Talento del background', fixed: featByEn(R.bg.feat.en), fixedVariant: R.bg.feat.variant || null, cats: ['origin'] });
    if (Gs.some(x => x.g.originFeat)) push({ key: 'orig2', level: 0, label: 'Talento di origine extra (dalla specie)', cats: ['origin'] });
    const fs = hasFightingStyle(R);
    const fsAlt = [];
    [R.c, R.sub].forEach(o => (o && o.choices || []).forEach(ch => { if (/fighting style/i.test(ch.en || '') && (ch.level || 1) <= R.L) (ch.options || []).forEach(op => { if (!(op.grants && op.grants.fightingStyle)) fsAlt.push(op); }); }));
    R.features.forEach(f => {
      const en = f.en || '';
      const g = f.grants || {};
      if (g.fightingStyle || /^fighting style$/i.test(en)) push({ key: 'fs', level: f.level || 1, label: 'Stile di combattimento', cats: ['fighting'], alt: fsAlt });
      if (g.asi || /ability score improvement/i.test(en)) push({ key: 'asi' + f.level, level: f.level, label: `${ord(f.level)} livello: aumento dei punteggi o talento`, cats: ['general', 'origin'].concat(fs ? ['fighting'] : []), asi: true });
      if (g.epicBoon || /epic boon/i.test(en)) push({ key: 'epic', level: f.level, label: `${ord(f.level)} livello: Dono epico`, cats: ['epic', 'general', 'origin'].concat(fs ? ['fighting'] : []) });
    });
    return slots.sort((a, b) => a.level - b.level);
  }

  function featEligible(f, slot, sc, takenIds) {
    if (!slot.cats.includes(f.category)) return 'categoria';
    const p = f.prereq || {};
    if (p.level && slot.level < p.level) return `serve il ${ord(p.level)} livello`;
    if (p.abilities && !abilityPrereqOk(p.abilities, sc)) return 'punteggio troppo basso';
    if (!f.repeatable && takenIds.includes(f.id)) return 'già preso';
    return '';
  }

  function compute() {
    const R = {};
    const c = R.c = byId(D.classes, S.classe);
    const L = R.L = Math.min(20, Math.max(1, parseInt(S.livello, 10) || 1));
    R.pb = 2 + Math.floor((L - 1) / 4);
    R.subLevel = (c && c.subclassLevel) || 3;
    R.sub = c && L >= R.subLevel ? byId(c.subclasses, S.sottoclasse) : null;
    R.sp = byId(D.species, S.specie);
    R.spChoices = (R.sp && R.sp.choices || []).map((ch, i) => ({ ch, key: 'spc_' + i, pick: byId(ch.options, S['spc_' + i]) }));
    R.spOpts = R.spChoices.map(x => x.pick).filter(Boolean);
    R.bg = byId(D.backgrounds, S.background);
    R.row = c ? (c.levels || []).find(l => l.level === L) : null;

    R.features = [];
    if (c) (c.levels || []).forEach(lv => { if (lv.level <= L) (lv.features || []).forEach(f => R.features.push(Object.assign({ src: 'c', level: lv.level }, f))); });
    if (R.sub) (R.sub.features || []).forEach(f => { if ((f.level || 0) <= L) R.features.push(Object.assign({ src: 's' }, f)); });

    R.choices = classChoices(R);
    const Gs = [];
    R.features.forEach(f => f.grants && Gs.push({ g: f.grants, label: nm(f), key: 'f' + f.src + f.level + norm(f.en) }));
    // Maestria e simili descritte come "scelta" invece che come privilegio (Bardo, Mago Studioso)
    [R.c, R.sub].forEach(o => (o && o.choices || []).forEach(ch => {
      const lv = ch.level || 1;
      if (lv > L) return;
      const featHas = key => R.features.some(f => (f.level || 1) === lv && f.grants && f.grants[key]);
      const exp = (ch.grants && ch.grants.expertise) || (/expertise/i.test(ch.en || '') ? (ch.count || 2) : 0);
      if (exp && !featHas('expertise')) Gs.push({ g: { expertise: exp }, label: nm(ch), key: 'chg' + lv + norm(ch.en) });
      if (Array.isArray(ch.options) && ch.options.length && ch.options.every(op => SK[op.id]) && !ch.grants)
        Gs.push({ g: { skillChoice: { choose: ch.count || 1, from: ch.options.map(op => op.id) } }, label: nm(ch), key: 'chs' + lv + norm(ch.en) });
    }));
    R.choices.forEach(x => x.picked.forEach((o, i) => o && o.grants && Gs.push({ g: o.grants, label: nm(o), key: x.key + i })));
    (R.sp && R.sp.traits || []).forEach(t => t.grants && Gs.push({ g: t.grants, label: nm(t), key: 'tr' + norm(t.en) }));
    R.spOpts.forEach(o => o.grants && Gs.push({ g: o.grants, label: nm(o), key: 'so' + o.id }));

    // punteggi
    R.base = {}; R.bgBonus = {}; R.featBonus = {};
    ABIL.forEach(a => { R.base[a.id] = baseVal(a.id); R.bgBonus[a.id] = 0; R.featBonus[a.id] = 0; });
    if (R.bg) {
      const ab = R.bg.abilities || [];
      if (S.bg_modo === '111') ab.forEach(x => R.bgBonus[x] = 1);
      else {
        if (ab.includes(S.bg_piu2)) R.bgBonus[S.bg_piu2] += 2;
        if (ab.includes(S.bg_piu1) && S.bg_piu1 !== S.bg_piu2) R.bgBonus[S.bg_piu1] += 1;
      }
    }
    const sc = {};
    ABIL.forEach(a => sc[a.id] = capAdd(R.base[a.id], R.bgBonus[a.id], 20));

    // talenti
    R.slots = featSlots(R, Gs);
    R.feats = [];
    const taken = [];
    R.slots.forEach(slot => {
      const k = 'ft_' + slot.key;
      let f = slot.fixed || null, alt = null;
      if (!f) {
        const v = S[k] || '';
        if (v.startsWith('alt:')) alt = byId(slot.alt, v.slice(4));
        else f = FEAT[v] || null;
      }
      slot.feat = f; slot.altPick = alt; slot.err = '';
      if (f && !slot.fixed) slot.err = featEligible(f, slot, sc, taken);
      if (f) taken.push(f.id);
      if (f && f.asi) {
        const max = f.asi.max || 20;
        const add = (a, n) => { if (!AB[a] || sc[a] == null) return; const b = sc[a]; sc[a] = capAdd(b, n, max); R.featBonus[a] += sc[a] - b; };
        if (f.asi.special) {
          if (S[k + '_m'] === '11') { add(S[k + '_a'], 1); if (S[k + '_b'] !== S[k + '_a']) add(S[k + '_b'], 1); }
          else add(S[k + '_a'], 2);
        } else if (f.asi.from) {
          const a = f.asi.from.length === 1 ? f.asi.from[0] : S[k + '_a'];
          slot.asiPick = a;
          add(a, f.asi.amount || 1);
        }
      }
      if (f) { R.feats.push(slot); if (f.grants) Gs.push({ g: f.grants, label: nm(f), key: 'ft' + slot.key, slot }); }
      if (alt && alt.grants) Gs.push({ g: alt.grants, label: nm(alt), key: 'fa' + slot.key });
    });
    Gs.forEach(x => {
      const inc = x.g.abilityIncrease;
      if (!inc) return;
      const max = inc.max || 25;
      ABIL.forEach(a => { if (inc[a.id] && sc[a.id] != null) { const b = sc[a.id]; sc[a.id] = capAdd(b, inc[a.id], max); R.featBonus[a.id] += sc[a.id] - b; } });
    });
    R.score = sc;
    R.mod = {}; ABIL.forEach(a => R.mod[a.id] = modOf(sc[a.id]));
    R.Gs = Gs;
    const G = R.G = Gs.map(x => x.g);
    const sumG = key => G.reduce((t, g) => t + (typeof g[key] === 'number' ? g[key] : 0), 0);

    // competenze nelle abilità
    R.skillSrc = [];
    if (R.bg) R.skillSrc.push({ key: 'bg', label: 'Background ' + nm(R.bg), fixed: (R.bg.skills || []).filter(s => SK[s]) });
    if (c && c.skills) R.skillSrc.push({ key: 'cls', label: 'Classe ' + nm(c), choose: c.skills.choose, from: c.skills.from });
    Gs.forEach(x => { const sc2 = x.g.skillChoice; if (sc2) R.skillSrc.push({ key: 'g_' + x.key.replace(/[^a-z0-9_]/gi, ''), label: x.label, choose: sc2.choose || 1, from: sc2.from }); });
    R.prof = new Set();
    R.skillSrc.forEach(src => {
      (src.fixed || []).forEach(s => R.prof.add(s));
      src.picks = [];
      for (let i = 0; i < (src.choose || 0); i++) { const v = S['sk_' + src.key + '_' + i]; src.picks.push(v || ''); }
    });
    R.skillSrc.forEach(src => src.picks.forEach(v => v && SK[v] && R.prof.add(v)));
    R.expN = sumG('expertise');
    R.exp = new Set();
    for (let i = 0; i < R.expN; i++) { const v = S['mx_' + i]; if (v && R.prof.has(v)) R.exp.add(v); }
    if (G.some(g => g.allSkills)) SKILLS.forEach(s => R.prof.add(s.id));

    // tiri salvezza
    R.saves = new Set(c ? c.saves || [] : []);
    G.forEach(g => { if (Array.isArray(g.saveProf)) g.saveProf.forEach(a => R.saves.add(a)); if (g.allSaves) ABIL.forEach(a => R.saves.add(a.id)); });
    R.feats.forEach(slot => { if (slot.feat.grants && slot.feat.grants.saveProf === 'choice' && slot.asiPick) R.saves.add(slot.asiPick); });

    // bonus
    R.saveBonus = {}; ABIL.forEach(a => R.saveBonus[a.id] = R.mod[a.id] == null ? null : R.mod[a.id] + (R.saves.has(a.id) ? R.pb : 0));
    R.skillBonus = {};
    SKILLS.forEach(s => { const m = R.mod[s.ab]; R.skillBonus[s.id] = m == null ? null : m + (R.exp.has(s.id) ? 2 * R.pb : R.prof.has(s.id) ? R.pb : 0); });
    // Mago (Druido) e Taumaturgo (Chierico): + mod. di Saggezza, minimo +1, ad alcune abilità
    R.skillExtra = {};
    G.forEach(g => { const x = g.skillAbilityBonus; if (!x || R.mod[x.ab] == null) return; x.skills.forEach(id => { if (R.skillBonus[id] == null) return; const b = Math.max(x.min || 0, R.mod[x.ab]); R.skillBonus[id] += b; R.skillExtra[id] = b; }); });
    R.init = R.mod.des == null ? null : R.mod.des + (G.some(g => g.initiativePB) ? R.pb : 0);
    R.pp = R.skillBonus.percezione == null ? null : 10 + R.skillBonus.percezione;

    // addestramento
    R.armorTrain = new Set(c ? c.armor || [] : []);
    G.forEach(g => (g.armor || []).forEach(a => R.armorTrain.add(a)));
    R.weaponProf = Object.assign({ simple: false, martial: false, martialWithProps: [], specific: [] }, c && c.weaponProf || {});
    if (G.some(g => g.weaponProf === 'martial')) R.weaponProf.martial = true;

    // armatura e CA
    R.armor = byId(EQ.armor, S.armatura);
    if (R.armor && R.armor.category === 'scudi') R.armor = null;
    R.shieldItem = (EQ.armor || []).find(a => a.category === 'scudi');
    R.shield = !!S.scudo;
    const dex = R.mod.des || 0;
    R.acNotes = [];
    let ac;
    let shieldOk = true;
    if (R.armor) {
      const a = R.armor;
      ac = (a.ac || 10) + (a.addDex ? (a.dexMax != null ? Math.min(dex, a.dexMax) : dex) : 0);
      R.acNotes.push(`${nm(a)}: ${a.ac}${a.addDex ? ' + DES' + (a.dexMax != null ? ` (max ${a.dexMax})` : '') : ''}`);
      if (!R.armorTrain.has(a.category)) R.acNotes.push('<span class="warn">⚠ Non sei addestrato in questa armatura: svantaggio su Forza e Destrezza e niente incantesimi.</span>');
      if (a.strReq && (R.score.for || 0) < a.strReq) R.acNotes.push(`<span class="warn">⚠ Serve Forza ${a.strReq}: senza, la tua velocità cala di 10 piedi.</span>`);
      if (a.stealthDisadv) R.acNotes.push('Svantaggio alle prove di Furtività.');
      const def = G.reduce((t, g) => t + (g.acBonusArmored || 0), 0);
      if (def) { ac += def; R.acNotes.push(`+${def} dallo stile Difesa`); }
    } else {
      ac = 10 + dex; let how = '10 + DES (senza armatura)';
      G.forEach(g => {
        const f = g.acFormula; if (!f) return;
        const v = (f.base || 10) + (f.abilities || []).reduce((t, a) => t + (R.mod[a] || 0), 0);
        if (v > ac) { ac = v; how = `Difesa senza armatura: ${f.base || 10} + ${(f.abilities || []).map(a => AB[a].short).join(' + ')}`; if (f.shieldAllowed === false) shieldOk = false; }
      });
      R.acNotes.push(how);
    }
    if (R.shield) {
      if (!shieldOk) R.acNotes.push('<span class="warn">⚠ Con lo scudo perdi la Difesa senza armatura del Monaco.</span>');
      ac += (R.shieldItem && R.shieldItem.acBonus) || 2;
      R.acNotes.push('+2 scudo');
      if (!R.armorTrain.has('scudi')) R.acNotes.push('<span class="warn">⚠ Non sei addestrato negli scudi: non ricevi il +2.</span>'), ac -= 2;
    }
    R.ac = R.mod.des == null ? null : ac;

    // velocità e taglia
    let speed = (R.spOpts.find(o => o.speed) || {}).speed || (R.sp && R.sp.speed) || 30;
    G.forEach(g => { if (typeof g.speed === 'number') speed = Math.max(speed, g.speed); });
    R.speedNotes = [];
    const um = R.row && R.row.columns && Object.keys(R.row.columns).find(k => /unarmored movement/i.test(k));
    G.forEach((g, i) => {
      if (!g.speedBonus) return;
      const lab = Gs[i].label;
      if (/unarmored movement/i.test(lab) && (um || R.armor || R.shield)) return;
      if (/fast movement/i.test(lab) && R.armor && R.armor.category === 'pesanti') return;
      speed += g.speedBonus; R.speedNotes.push(`+${g.speedBonus} da ${lab}`);
    });
    if (um && !R.armor && !R.shield) { const n = parseInt(String(R.row.columns[um]).replace(/[^\d]/g, ''), 10); if (n) { speed += n; R.speedNotes.push(`+${n} movimento senza armatura`); } }
    R.speed = speed;
    const sizes = R.sp ? (R.sp.size || []) : [];
    const sizeChoice = R.spChoices.find(x => /^size$/i.test(x.ch.en || ''));
    R.size = sizeChoice ? (sizeChoice.pick ? sizeChoice.pick.it : null) : sizes.length > 1 ? (sizes.includes(S.taglia) ? S.taglia : null) : (sizes[0] || null);

    // punti ferita
    if (c && R.mod.cos != null) {
      const hd = c.hitDie, con = R.mod.cos;
      const per = Math.max(1, hd / 2 + 1 + con);
      let hp = hd + con + (L - 1) * per;
      const extra = sumG('hpPerLevel') * L + sumG('hpMaxBonus');
      R.hpCalc = Math.max(1, hp + extra);
      R.hpNote = `1° livello: ${hd} (massimo del d${hd}) ${sign(con)} COS` + (L > 1 ? ` · livelli 2-${L}: ${hd / 2 + 1} ${sign(con)} COS ciascuno` : '') + (extra ? ` · +${extra} da tratti/talenti` : '');
    } else { R.hpCalc = null; R.hpNote = ''; }

    // incantesimi
    R.cast = null;
    if (c && c.spellcasting) R.cast = Object.assign({ list: c.id, levels: c.levels, from: c }, c.spellcasting);
    else if (R.sub && R.sub.spellcasting) R.cast = Object.assign({ list: R.sub.spellcasting.list || 'wizard', levels: R.sub.levels || [], from: R.sub }, R.sub.spellcasting);
    if (R.cast) {
      const row = (R.cast.levels || []).find(l => l.level === L) || {};
      R.cast.row = row;
      R.cast.slots = row.slots || [0, 0, 0, 0, 0, 0, 0, 0, 0];
      R.cast.pact = row.pactSlots ? { n: row.pactSlots, lvl: row.pactSlotLevel } : null;
      R.cast.cantrips = (row.cantrips || 0) + sumG('cantripsExtra') + sumG('cantrips');
      R.cast.prepared = (row.prepared || 0) + R.feats.filter(sl => sl.feat && sl.feat.id === 'magic-initiate').length;
      let max = 0; R.cast.slots.forEach((n, i) => { if (n > 0) max = i + 1; });
      if (R.cast.pact) max = Math.max(max, R.cast.pact.lvl || 0);
      R.cast.maxLvl = max;
      // Arcanum mistico del Warlock: un incantesimo di 6°, 7°, 8° e 9° livello, fuori dagli slot del patto
      R.cast.arcanum = [];
      (c && c.choices || []).forEach(ch => { const m = /mystic arcanum.*?(\d)/i.exec(ch.en || ''); if (m && (ch.level || 99) <= L) R.cast.arcanum.push(+m[1]); });
      R.cast.pickMax = Math.max(max, ...R.cast.arcanum, 0);
      const m = R.mod[R.cast.ability];
      R.cast.mod = m; R.cast.dc = m == null ? null : 8 + m + R.pb; R.cast.atk = m == null ? null : m + R.pb;
    }
    R.autoSpells = [];
    R.landVariant = S['fopt_' + (R.sub ? R.sub.id : '')] || '';
    if (R.sub) (R.sub.alwaysPrepared || []).forEach(x => {
      if ((x.level || 0) > L) return;
      if (x.variant && x.variant !== R.landVariant) return;
      (x.spells || []).forEach(en => R.autoSpells.push({ en, src: 'sottoclasse' + (x.note ? ' · ' + x.note : '') }));
    });
    G.forEach(g => { const ap = g.spellsKnownExtra && g.spellsKnownExtra.alwaysPrepared; if (ap) ap.forEach(en => R.autoSpells.push({ en, src: 'classe' })); });
    R.spOpts.forEach(o => (o.spells || []).forEach(x => { if ((x.level || 1) <= L) R.autoSpells.push({ en: x.en, src: 'specie' }); }));
    G.forEach(g => { if (typeof g.cantrip === 'string') R.autoSpells.push({ en: g.cantrip, src: 'specie' }); });

    // padronanza armi
    R.wmN = 0;
    const wmCol = R.row && R.row.columns && Object.keys(R.row.columns).find(k => /mastery/i.test(k));
    if (wmCol) R.wmN = parseInt(R.row.columns[wmCol], 10) || 0;
    R.wmN = Math.max(R.wmN, ...G.map(g => g.weaponMastery || 0));
    R.mastery = new Set(); for (let i = 0; i < R.wmN; i++) if (S['wm_' + i]) R.mastery.add(S['wm_' + i]);
    return R;
  }

  function weaponProficient(w, R) {
    const p = R.weaponProf;
    if (w.category === 'semplice' && p.simple) return true;
    if (w.category === 'marziale' && p.martial) return true;
    if (w.category === 'marziale' && (p.martialWithProps || []).length && (w.properties || []).some(x => p.martialWithProps.map(norm).includes(norm(x)))) return true;
    if ((p.specific || []).map(norm).includes(norm(w.en))) return true;
    return false;
  }

  // ------------------------------------------------------------------ interfaccia
  const UI = { open: {}, view: {}, prog: false, page: null, cmp: {} }; // page: 'personaggi' quando è aperto l'elenco
  const TABS = [
    { id: 'classe', n: '1', t: 'Classe', p: 33 },
    { id: 'origine', n: '2', t: 'Origine', p: 36 },
    { id: 'caratteristiche', n: '3', t: 'Caratteristiche', p: 38 },
    { id: 'allineamento', n: '4', t: 'Allineamento', p: 39 },
    { id: 'dettagli', n: '5', t: 'Dettagli', p: 40 },
    { id: 'scheda', n: '★', t: 'Scheda finale' }
  ];
  if (!TABS.some(t => t.id === S._tab)) S._tab = 'classe';
  const $ = id => document.getElementById(id);
  const DIFF = { Bassa: 'low', Media: 'mid', Alta: 'high' };
  const armorShort = arr => !(arr && arr.length) ? 'nessuna' : ['leggere', 'medie', 'pesanti', 'scudi'].every(a => arr.includes(a)) ? 'tutte, e scudi' : arr.join(', ');
  const abChips = (arr, prim = []) => (arr || []).map(a => `<span class="chip${prim.includes(a) ? ' prim' : ''}">${AB[a] ? AB[a].short : a}</span>`).join('');
  const skillNames = arr => (arr || []).map(s => SK[s] ? SK[s].it : s).join(', ');
  const spName = en => { const s = spellByEn(en); return s ? (s.it || s.en) : en; };
  let CUR = null;

  function toolName(t) {
    if (!t) return '—';
    if (typeof t === 'string') return t;
    if (t.en) { const it = itemByEn(t.en); const n = it ? (it.it || it.en) : (t.it || t.en); return n + (t.choice && !/a scelta/.test(n) ? ' (a scelta)' : ''); }
    return t.it || t.choice || t.text || '—';
  }
  const VARIANT_IT = { Cleric: 'Chierico', Druid: 'Druido', Wizard: 'Mago' };
  const variantIt = v => VARIANT_IT[v] || v;
  function featLabel(f) {
    if (!f) return '—';
    const ft = featByEn(f.en);
    return (ft ? (ft.it || ft.en) : f.en) + (f.variant ? ` (${variantIt(f.variant)})` : '');
  }
  function pointsUsed() { return ABIL.reduce((t, a) => t + (POINT_COST[baseVal(a.id)] || 0), 0); }

  function card(key, id, sel, inner, o = {}) {
    const attrs = o.dis ? 'aria-disabled="true"' : `role="button" tabindex="0" data-pick="${key}" data-val="${esc(id)}" aria-pressed="${sel ? 'true' : 'false'}"`;
    return `<div class="card${sel ? ' sel' : ''}${o.dis ? ' dis' : ''}" ${attrs}>${sel ? '<span class="tick">✓ scelta</span>' : ''}${inner}</div>`;
  }
  const ph = (title, helpKey, right = '') => `<div class="ph"><h2>${title} ${help(helpKey)}</h2><div class="ph-r">${right}</div></div>`;
  const seg = key => {
    const v = UI.view[key] || 'cards';
    return `<div class="seg"><button type="button" data-ui="view:${key}:cards" class="${v === 'cards' ? 'on' : ''}">Schede</button><button type="button" data-ui="view:${key}:table" class="${v === 'table' ? 'on' : ''}">Tabella di confronto</button></div>`;
  };
  const intro = (n, title, text, page) => `<div class="intro"><div class="big-n">${n}</div><div><h1>${title}</h1><p>${text} ${page ? pg(page) : ''}</p></div></div>`;

  // Elenco di schede affiancate; dopo la scelta si chiude e mostra solo quella scelta
  function chooser(o) {
    const sel = byId(o.items, S[o.key]);
    const open = !sel || !!UI.open[o.key];
    const view = o.table ? (UI.view[o.key] || 'cards') : 'cards';
    let right = '';
    if (open && o.table) right += seg(o.key);
    if (sel && open) right += `<button type="button" class="btn ghost" data-ui="close:${o.key}">Chiudi il confronto</button>`;
    let h = ph(o.title, o.help, right);
    if (o.lead) h += `<p class="lead">${o.lead}</p>`;
    if (!open) {
      h += `<div class="chosen">${o.card(sel, true)}<div class="chosen-side">${o.side ? o.side(sel) : ''}<button type="button" class="btn" data-ui="open:${o.key}">Cambia o confronta con le altre (${o.items.length})</button></div></div>`;
    } else if (view === 'table') h += `<div class="scroll-x">${o.table(sel)}</div>`;
    else h += `<div class="cards${o.small ? ' small' : ''}">${o.items.map(it => o.card(it, it === sel)).join('')}</div>`;
    return `<div class="panel" id="p-${o.key}">${h}</div>`;
  }

  // ------------------------------------------------------------------ stato dei passi
  function detailStatus(R) {
    const sec = {};
    sec['d-nome'] = { t: 'Nome', ok: !!S.nome };
    sec['d-abilita'] = { t: 'Abilità', ok: !R.skillSrc.some(s => s.picks.some(p => !p)) && !(R.expN && R.exp.size < R.expN) };
    sec['d-privilegi'] = { t: 'Scelte di classe', ok: !R.choices.some(x => x.picked.some(p => !p)) && !(R.wmN && R.mastery.size < R.wmN) };
    sec['d-talenti'] = { t: 'Talenti', ok: !R.slots.some(s => !s.feat && !s.altPick) };
    sec['d-equip'] = { t: 'Equipaggiamento', ok: !!S.eq_applicato };
    if (R.cast) { const cnt = spellCounts(R); sec['d-incantesimi'] = { t: 'Incantesimi', ok: cnt.cantrips >= R.cast.cantrips && cnt.prepared >= R.cast.prepared }; }
    else sec['d-incantesimi'] = { t: 'Incantesimi', ok: true, optional: true };
    sec['d-storia'] = { t: 'Aspetto e storia', ok: !!(S.aspetto || S.storia), optional: true };
    return sec;
  }
  function stepStatus(R) {
    const st = {};
    st.classe = [];
    if (!R.c) st.classe.push('classe');
    if (R.c && R.L >= R.subLevel && !R.sub) st.classe.push('sottoclasse');
    const m2 = [];
    if (!R.bg) m2.push('background');
    if (!R.sp) m2.push('specie');
    R.spChoices.forEach(x => { if (!x.pick) m2.push(String(x.ch.it || x.ch.en).toLowerCase()); });
    if (R.sp && (R.sp.size || []).length > 1 && !R.size && !R.spChoices.some(x => /^size$/i.test(x.ch.en || ''))) m2.push('taglia');
    if (!S.lingua1 || !S.lingua2) m2.push('lingue');
    st.origine = m2;
    const m3 = [];
    if (ABIL.some(a => R.base[a.id] == null)) m3.push('punteggi');
    if (S.metodo === 'punti' && pointsUsed() > 27) m3.push('troppi punti');
    if (R.bg && S.bg_modo !== '111' && (!S.bg_piu2 || !S.bg_piu1 || S.bg_piu1 === S.bg_piu2)) m3.push('bonus del background');
    if (!R.bg) m3.push('background (passo 2)');
    st.caratteristiche = m3;
    st.allineamento = S.allineamento ? [] : ['allineamento'];
    const d = detailStatus(R);
    st.dettagli = Object.keys(d).filter(k => !d[k].ok && !d[k].optional).map(k => d[k].t.toLowerCase());
    return st;
  }

  function renderNav(st) {
    $('stepnav').innerHTML = TABS.map(t => {
      const miss = st[t.id];
      const done = miss && !miss.length;
      const sub = miss ? `<span class="s">${done ? 'fatto' : 'manca: ' + esc(miss.slice(0, 2).join(', ')) + (miss.length > 2 ? '…' : '')}</span>` : '<span class="s" style="color:var(--muted)">da usare al tavolo</span>';
      return `<button type="button" class="pill${done ? ' done' : ''}${t.id === S._tab && !UI.page ? ' active' : ''}${t.id === 'scheda' ? ' final' : ''}" data-tab="${t.id}"><span class="n">${done ? '✓' : t.n}</span><span class="t">${t.t}${sub}</span></button>`;
    }).join('');
  }
  function nextbar(id, st) {
    const i = TABS.findIndex(t => t.id === id);
    const prev = TABS[i - 1], next = TABS[i + 1];
    const miss = st[id] || [];
    return `<div class="nextbar">${prev ? `<button type="button" class="btn ghost" data-tab="${prev.id}">← ${prev.t}</button>` : '<span></span>'}
      <span class="st">${miss.length ? 'Ancora da fare: ' + esc(miss.join(', ')) : '✓ Passo completato'}</span>
      ${next ? `<button type="button" class="btn primary" data-tab="${next.id}">${next.id === 'scheda' ? 'Vai alla scheda finale' : 'Avanti: ' + next.t} →</button>` : '<span></span>'}</div>`;
  }

  // ------------------------------------------------------------------ passo 1: classe
  function bars(arr, prim) {
    return `<div class="bars" title="Punteggi consigliati dal manuale per questa classe (serie standard, PHB p. 38)">${ABIL.map((a, i) => {
      const v = arr[i];
      return `<div class="bar${prim.includes(a.id) ? ' prim' : ''}"><span class="bv">${v}</span><span class="bf" style="height:${Math.round((v - 6) / 9 * 100)}%"></span><span class="bl">${a.short}</span></div>`;
    }).join('')}</div>`;
  }
  function magicText(c) {
    if (c.spellcasting) return c.spellcasting.kind === 'half' ? 'Armi + incantesimi' : c.spellcasting.kind === 'pact' ? 'Incantesimi (patto)' : 'Incantesimi';
    return (c.subclasses || []).some(s => s.spellcasting) ? 'Armi (magia con una sottoclasse)' : 'Armi e abilità';
  }
  function classCard(c, sel) {
    const arr = STD_BY_CLASS[c.id] || [10, 10, 10, 10, 10, 10];
    return card('classe', c.id, sel, `<div class="c-top"><div><div class="c-name">${esc(c.it)}</div><div class="c-en">${esc(c.en)} ${pg(c.page)}</div></div><span class="diff ${DIFF[c.complexity] || ''}">${esc(c.complexity || '')}</span></div>
      <p class="c-desc">${esc(c.desc)}</p>
      ${bars(arr, c.primary || [])}
      <div class="facts"><span><b>d${c.hitDie}</b> dado vita</span><span>${magicText(c)}</span><span>Armature: ${armorShort(c.armor)}</span></div>`);
  }
  function classTable(sel) {
    const rows = D.classes.map(c => {
      const arr = STD_BY_CLASS[c.id] || [];
      const prim = c.primary || [];
      return `<tr class="${c === sel ? 'sel' : ''}" data-pick="classe" data-val="${c.id}" role="button" tabindex="0">
        <th>${esc(c.it)}<div class="c-en">${esc(c.en)}</div></th>
        <td><span class="diff ${DIFF[c.complexity] || ''}">${esc(c.complexity || '')}</span></td>
        <td>${esc(c.desc)}</td>
        <td class="num">d${c.hitDie}</td>
        <td>${(c.saves || []).map(a => AB[a].short).join(', ')}</td>
        <td>${armorShort(c.armor)}</td>
        <td>${magicText(c)}</td>
        ${arr.map((v, i) => `<td class="num"><div class="heat h${v}${prim.includes(ABIL[i].id) ? ' prim' : ''}">${v}</div></td>`).join('')}</tr>`;
    }).join('');
    return `<table class="cmp"><thead><tr><th>Classe</th><th>Difficoltà</th><th>In breve</th><th class="num">Dado vita</th><th>Tiri salvezza</th><th>Armature</th><th>Stile</th>${ABIL.map(a => `<th class="num">${a.short}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
      <div class="hint">Le colonne FOR–CAR sono i punteggi che il manuale consiglia per ogni classe con la serie standard ${pg(38)}: più la casella è scura, più quella caratteristica conta. Il bordo rosso indica la caratteristica principale. Clicca una riga per scegliere la classe.</div>`;
  }
  function classDetail(R) {
    const c = R.c;
    const con = R.mod.cos;
    const rows = [
      ['Caratteristica principale', (c.primary || []).map(a => AB[a].it).join(' e ') + (c.primaryNote ? ` <span class="sub">(${esc(c.primaryNote)})</span>` : '')],
      ['Punti ferita', `d${c.hitDie} per livello · al 1° livello: ${c.hitDie} + modificatore di Costituzione${con != null ? ` = <b>${c.hitDie + con}</b>` : ''}`],
      ['Tiri salvezza', (c.saves || []).map(a => AB[a].it).join(', ')],
      ['Abilità', c.skills ? `ne scegli ${c.skills.choose} fra ${c.skills.from === 'any' ? 'tutte' : esc(skillNames(c.skills.from))}` : '—'],
      ['Armature', armorShort(c.armor)],
      ['Armi', esc(c.weaponProf && c.weaponProf.text || '—')],
      ['Strumenti', esc(c.toolProf && c.toolProf.text || 'nessuno')],
      ['Incantesimi', c.spellcasting ? `sì, con ${AB[c.spellcasting.ability].it}${c.spellcasting.focus ? ' · focus: ' + esc(c.spellcasting.focus) : ''}` : ((c.subclasses || []).some(s => s.spellcasting) ? 'no (sì con alcune sottoclassi)' : 'no')],
      ['Sottoclasse', `si sceglie al ${ord(R.subLevel)} livello`]
    ];
    const prog = (c.levels || []).map(lv => `<tr class="${lv.level === R.L ? 'now' : lv.level < R.L ? 'past' : 'future'}"><td>${lv.level}°</td><td>${sign(lv.pb)}</td><td>${(lv.features || []).map(f => esc(f.it || f.en)).join(', ')}</td></tr>`).join('');
    return `<div class="panel">${ph('Il tuo ' + esc(c.it) + ' ' + pg(c.page), 'classe')}
      <p class="lead">${esc(c.descLong || c.desc)}</p>
      <dl class="facts-grid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <details class="prog" data-prog${UI.prog ? ' open' : ''}><summary>Cosa ottieni livello per livello</summary><div class="scroll-x"><table class="prog"><thead><tr><th>Liv.</th><th>Comp.</th><th>Privilegi</th></tr></thead><tbody>${prog}</tbody></table></div></details></div>`;
  }
  function subChooser(R) {
    const c = R.c, locked = R.L < R.subLevel;
    const subCard = (s, sel) => card('sottoclasse', s.id, sel, `<div class="c-name">${esc(s.it || s.en)}</div><div class="c-en">${esc(s.en)} ${pg(s.page)}</div>
      <p class="c-desc">${esc(s.desc || '')}</p>
      <ul class="flist">${(s.features || []).map(f => `<li><b>${f.level}°</b> ${esc(f.it || f.en)}</li>`).join('')}</ul>`, { dis: locked });
    if (locked) return `<div class="panel">${ph(`Sottoclasse: si sceglie al ${ord(R.subLevel)} livello`, 'sottoclasse')}<p class="lead">Per ora non devi sceglierla, ma puoi già leggere le opzioni del ${esc(c.it)} per farti un'idea.</p><div class="cards">${(c.subclasses || []).map(s => subCard(s, false)).join('')}</div></div>`;
    return chooser({ key: 'sottoclasse', title: 'Scegli la sottoclasse', help: 'sottoclasse', items: c.subclasses || [], card: subCard, lead: 'La sottoclasse è una specializzazione della classe: aggiunge privilegi ai livelli indicati nell\'elenco.' });
  }
  function renderTabClass(R, st) {
    let h = intro('1', 'Scegli la classe', 'È la scelta più importante: decide cosa sa fare il personaggio. Confronta le classi qui sotto, anche in tabella, e clicca quella che ti piace. La difficoltà indica quante regole e opzioni dovrai gestire: per un primo personaggio Guerriero e Ladro sono le più semplici.', 33);
    h += chooser({ key: 'classe', title: 'Le 12 classi', help: 'classe', items: D.classes, card: classCard, table: classTable,
      lead: 'Le barre mostrano i punteggi di caratteristica che il manuale consiglia per ogni classe; in rosso le caratteristiche principali. Con «Tabella di confronto» vedi tutte le classi affiancate.' });
    h += `<div class="panel">${ph('Livello di partenza', 'livello')}<div class="two"><div>${selectHTML('livello', Array.from({ length: 20 }, (_, i) => ({ v: i + 1, t: `${i + 1}° livello (da ${XP[i].toLocaleString('it-IT')} PE)` })), { ph: false })}</div>
      <div>${hint('Quasi sempre si parte dal 1° livello: chiedi al DM. Se cambi livello la scheda ricalcola da sola punti ferita, bonus, privilegi e incantesimi.')}</div></div></div>`;
    if (R.c) h += classDetail(R) + subChooser(R);
    $('tab-classe').innerHTML = h + nextbar('classe', st);
  }

  // ------------------------------------------------------------------ passo 2: origine
  function bgCard(b, sel) {
    const prim = CUR.c ? CUR.c.primary || [] : [];
    const good = prim.some(a => (b.abilities || []).includes(a));
    return card('background', b.id, sel, `<div class="c-top"><div><div class="c-name">${esc(b.it)}</div><div class="c-en">${esc(b.en)} ${pg(b.page)}</div></div>${good ? '<span class="star">★ adatto</span>' : ''}</div>
      <p class="c-desc">${esc(b.desc)}</p>
      <div class="kv"><b>Caratteristiche</b> <span class="chips" style="display:inline-flex">${abChips(b.abilities, prim)}</span></div>
      <div class="kv"><b>Abilità</b> ${esc(skillNames(b.skills))}</div>
      <div class="kv"><b>Talento</b> ${esc(featLabel(b.feat))}</div>
      <div class="kv"><b>Strumento</b> ${esc(toolName(b.tool))}</div>`);
  }
  function bgTable(sel) {
    const prim = CUR.c ? CUR.c.primary || [] : [];
    return `<table class="cmp"><thead><tr><th>Background</th><th>Caratteristiche</th><th>Abilità</th><th>Talento</th><th>Strumento</th><th></th></tr></thead><tbody>${D.backgrounds.map(b => {
      const good = prim.some(a => (b.abilities || []).includes(a));
      return `<tr class="${b === sel ? 'sel' : ''}" data-pick="background" data-val="${b.id}" role="button" tabindex="0"><th>${esc(b.it)}<div class="c-en">${esc(b.en)}</div></th><td><span class="chips">${abChips(b.abilities, prim)}</span></td><td>${esc(skillNames(b.skills))}</td><td>${esc(featLabel(b.feat))}</td><td>${esc(toolName(b.tool))}</td><td>${good ? '<span class="star">★ adatto</span>' : ''}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  const traitNames = s => (s.traits || []).map(t => t.it || t.en);
  const spChoiceNames = s => (s.choices || []).filter(ch => !/^size$/i.test(ch.en || '')).map(ch => ch.it || ch.en);
  function spCard(s, sel) {
    return card('specie', s.id, sel, `<div class="c-name">${esc(s.it)}</div><div class="c-en">${esc(s.en)} ${pg(s.page)}</div>
      <p class="c-desc">${esc(s.desc)}</p>
      <div class="facts"><span>Taglia ${esc((s.size || []).map(sizeIt).join(' o '))}</span><span>Velocità ${esc(ftm(s.speed + ' ft'))}</span><span>${s.darkvision ? 'Scurovisione ' + esc(ftm(s.darkvision + ' ft')) : 'Niente scurovisione'}</span></div>
      <div class="chips">${traitNames(s).map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>
      ${spChoiceNames(s).length ? `<div class="kv"><b>Da scegliere</b> ${esc(spChoiceNames(s).join(', '))}</div>` : ''}`);
  }
  function spTable(sel) {
    return `<table class="cmp"><thead><tr><th>Specie</th><th>In breve</th><th>Taglia</th><th>Velocità</th><th>Scurovisione</th><th>Tratti</th><th>Da scegliere</th></tr></thead><tbody>${D.species.map(s => `<tr class="${s === sel ? 'sel' : ''}" data-pick="specie" data-val="${s.id}" role="button" tabindex="0">
      <th>${esc(s.it)}<div class="c-en">${esc(s.en)}</div></th><td>${esc(s.desc)}</td><td>${esc((s.size || []).map(sizeIt).join(' o '))}</td><td>${s.speed} piedi</td><td>${s.darkvision ? s.darkvision + ' piedi' : '—'}</td><td>${esc(traitNames(s).join(', '))}</td><td>${esc(spChoiceNames(s).join(', ') || '—')}</td></tr>`).join('')}</tbody></table>`;
  }
  function optCard(key, o, sel) {
    const extra = [];
    if (o.damageType) extra.push('Danni: ' + esc(o.damageType));
    if (o.darkvision) extra.push('Scurovisione ' + esc(ftm(o.darkvision + ' ft')));
    if (o.speed) extra.push('Velocità ' + esc(ftm(o.speed + ' ft')));
    const spells = (o.spells || []).map(s => `${esc(spName(s.en))} <span class="sub">(${s.cantrip || !s.level || s.level === 1 ? 'subito' : 'dal ' + ord(s.level) + ' liv.'})</span>`).join(', ');
    return card(key, o.id, sel, `<div class="c-name" style="font-size:16px">${esc(o.it || o.en)}</div>${o.it && o.en !== o.it ? `<div class="c-en">${esc(o.en)}</div>` : ''}
      <p class="c-desc">${esc(o.desc || '')}</p>${extra.length ? `<div class="facts">${extra.map(x => `<span>${x}</span>`).join('')}</div>` : ''}${spells ? `<div class="kv"><b>Incantesimi</b> ${spells}</div>` : ''}`);
  }
  function langsPanel() {
    const L = D.languages || {};
    const std = (L.standard || []).filter(l => norm(l.en) !== 'common');
    const rare = L.rare || [];
    const opts = k => std.map(l => ({ v: l.en, g: 'Standard', t: `${l.it || l.en}${l.origin ? ' — ' + l.origin : ''}`, dis: [S.lingua1, S.lingua2].includes(l.en) && S[k] !== l.en }))
      .concat(rare.map(l => ({ v: l.en, g: 'Rare (solo con il permesso del DM)', t: `${l.it || l.en}${l.origin ? ' — ' + l.origin : ''}`, dis: [S.lingua1, S.lingua2].includes(l.en) && S[k] !== l.en })));
    return `<div class="panel">${ph('Lingue', 'lingue')}<div class="two"><div>
      <div class="chips" style="margin-bottom:8px"><span class="chip prim">🔒 Comune</span></div>
      <div class="two" style="gap:8px"><div><span class="lbl">Lingua 2</span>${selectHTML('lingua1', opts('lingua1'))}</div><div><span class="lbl">Lingua 3</span>${selectHTML('lingua2', opts('lingua2'))}</div></div>
      <span class="lbl" style="margin-top:8px">Altre lingue (da classe, talenti, DM)</span><textarea rows="2" data-k="lingue_altre" data-free>${esc(S.lingue_altre || '')}</textarea></div>
      <div>${hint(L.rule ? esc(L.rule) : 'Comune + 2 lingue standard.')}</div></div></div>`;
  }
  function renderTabOrigin(R, st) {
    const prim = R.c ? (R.c.primary || []).map(a => AB[a].it).join(' o ') : '';
    let h = intro('2', 'Scegli l\'origine', 'L\'origine ha due parti: il background (cosa faceva il personaggio prima dell\'avventura) e la specie (il suo popolo). Poi scegli due lingue oltre al Comune.', 36);
    h += chooser({ key: 'background', title: 'Background', help: 'background', items: D.backgrounds, card: bgCard, table: bgTable,
      lead: 'Ogni background dà +3 punti nelle sue tre caratteristiche, competenza in 2 abilità e 1 strumento, un talento di origine e dell\'equipaggiamento.' + (prim ? ` <b>★ adatto</b> = aumenta ${esc(prim)}, la caratteristica principale del ${esc(R.c.it)}.` : ' Scegli prima la classe per vedere quali sono più adatti.') });
    h += chooser({ key: 'specie', title: 'Specie', help: 'specie', items: D.species, card: spCard, table: spTable,
      lead: 'La specie decide taglia, velocità e alcuni tratti speciali. Nelle regole 2024 non cambia i punteggi di caratteristica: sceglila per i tratti e per il gusto del personaggio.' });
    R.spChoices.forEach(x => {
      const isSize = /^size$/i.test(x.ch.en || '');
      h += chooser({ key: x.key, title: `${esc(x.ch.it || x.ch.en)} <span class="sub">(${esc(x.ch.en)})</span>`, help: isSize ? 'taglia' : 'specie', items: x.ch.options || [], card: (o, sel) => optCard(x.key, o, sel), small: true,
        lead: isSize ? 'La taglia cambia poco nel gioco: scegli quella che immagini per il personaggio.' : `Una scelta della specie ${esc(R.sp.it)}.` });
    });
    h += langsPanel();
    $('tab-origine').innerHTML = h + nextbar('origine', st);
  }

  // ------------------------------------------------------------------ passo 3: caratteristiche
  function builderHTML(R) {
    const m = S.metodo;
    const used = {};
    ABIL.forEach(a => { const v = S['base_' + a.id]; if (v) used[v] = (used[v] || 0) + 1; });
    const rows = ABIL.map(a => {
      let cell;
      const k = 'base_' + a.id;
      if (m === 'standard') cell = selectHTML(k, STD.map(n => ({ v: n, t: n, dis: used[n] && String(S[k]) !== String(n) })), { ph: '—' });
      else if (m === 'punti') cell = selectHTML(k, [8, 9, 10, 11, 12, 13, 14, 15].map(n => ({ v: n, t: `${n} (costo ${POINT_COST[n]})` })), { ph: false });
      else if (m === 'dadi') {
        const t = S.tiri || [];
        cell = t.length ? selectHTML(k, t.map((n, i) => ({ v: 'r' + i, t: `${n} (tiro ${i + 1})`, dis: used['r' + i] && S[k] !== 'r' + i })), { ph: '—' }) : '<span class="sub">tira prima i dadi</span>';
      } else cell = `<input type="number" min="1" max="30" class="center" data-k="${k}" value="${esc(S[k] || '')}">`;
      const isBg = R.bg && (R.bg.abilities || []).includes(a.id);
      const bgb = R.bgBonus[a.id];
      const isPrim = R.c && (R.c.primary || []).includes(a.id);
      return `<tr><td class="ab-name"><b>${a.it}</b> <span class="sub">${a.short}</span>${isPrim ? ' <span class="chip prim">principale</span>' : ''}<div class="sub">${ABDESC[a.id]}</div></td>
        <td style="width:160px">${cell}</td>
        <td>${isBg ? (bgb ? '<b>+' + bgb + '</b>' : '<span class="sub">+0</span>') : '<span class="sub">—</span>'}</td>
        <td>${R.featBonus[a.id] ? '<b>+' + R.featBonus[a.id] + '</b>' : '<span class="sub">—</span>'}</td>
        <td class="tot" style="width:70px"><span class="out">${R.score[a.id] ?? '—'}</span></td>
        <td class="tot" style="width:70px"><span class="out">${sign(R.mod[a.id])}</span></td></tr>`;
    }).join('');
    const ctrl1 = `<span class="lbl">Metodo ${help('metodo')}</span>` + selectHTML('metodo', [
      { v: 'standard', t: 'Serie standard: 15, 14, 13, 12, 10, 8 (consigliato)' },
      { v: 'punti', t: 'Acquisto a punti: 27 punti da spendere' },
      { v: 'dadi', t: 'Tiro di dadi: 4d6, tieni i 3 più alti' },
      { v: 'manuale', t: 'Inserisco io i valori (es. tiri fatti al tavolo)' }], { ph: false });
    let extra = '';
    if (m === 'standard') extra = (R.c ? `<button type="button" class="btn primary" data-act="suggest" style="margin-top:8px">Usa la distribuzione consigliata per ${esc(R.c.it)}</button>` : '') + hint('Assegna ognuno dei sei valori a una caratteristica diversa, oppure usa il pulsante qui sopra.');
    if (m === 'punti') { const p = pointsUsed(); extra = `<div class="${p > 27 ? 'warn' : 'okmsg'}" style="margin-top:6px">Punti spesi: <b>${p}</b> / 27${p > 27 ? ' — troppi!' : p < 27 ? ` (ne restano ${27 - p})` : ' ✓'}</div>` + hint('Ogni caratteristica parte da 8 (gratis). Salire costa di più verso l\'alto: 14 costa 7 punti, 15 ne costa 9.'); }
    if (m === 'dadi') extra = `<button type="button" class="btn" data-act="roll" style="margin-top:8px">${(S.tiri || []).length ? 'Ritira' : 'Tira'} 4d6 × 6</button>${(S.tiri || []).length ? `<span class="rolls">${S.tiri.map(n => `<span>${n}</span>`).join('')}</span>` : ''}` + hint('Poi assegna ogni risultato a una caratteristica. Chiedi al DM se si possono ritirare i dadi.');
    if (m === 'manuale') extra = hint('Scrivi i punteggi prima dei bonus del background (di solito fra 3 e 18).');
    let ctrl2;
    if (R.bg) {
      const ab = R.bg.abilities || [];
      ctrl2 = `<span class="lbl">Bonus del background: ${esc(R.bg.it)} ${help('bg_bonus')}</span>` + selectHTML('bg_modo', [{ v: '21', t: '+2 a una e +1 a un\'altra' }, { v: '111', t: '+1 a tutte e tre' }], { ph: false });
      if (S.bg_modo !== '111') ctrl2 += `<div class="two" style="gap:8px;margin-top:8px"><div><span class="lbl">+2 a</span>${selectHTML('bg_piu2', ab.map(a => ({ v: a, t: AB[a].it })))}</div><div><span class="lbl">+1 a</span>${selectHTML('bg_piu1', ab.map(a => ({ v: a, t: AB[a].it, dis: a === S.bg_piu2 })))}</div></div>`;
      const pr = R.c ? (R.c.primary || []).filter(a => ab.includes(a)) : [];
      ctrl2 += hint(pr.length ? `Consiglio: metti il +2 su ${pr.map(a => AB[a].it).join(' o ')}, la caratteristica principale della tua classe.` : 'Nessun punteggio può superare 20 con questi aumenti.');
    } else ctrl2 = `<span class="lbl">Bonus del background</span>` + hint('Scegli un background (passo 2) per ricevere +3 punti da distribuire.');
    const ctrl3 = `<span class="lbl">Altri aumenti</span>` + hint('La colonna «Talenti» si riempie da sola con gli aumenti dei livelli 4, 8, 12, 16 e 19, che scegli nel passo 5.');
    return `<div class="panel builder">${ph('I tuoi punteggi', 'caratteristiche', '<span class="sub">base + background + talenti = totale → modificatore</span>')}
      <div class="ctrl" style="margin:0 0 12px"><div>${ctrl1}${extra}</div><div>${ctrl2}</div><div>${ctrl3}</div></div>
      <div class="scroll-x"><table><thead><tr><th>Caratteristica</th><th>Base</th><th>Background</th><th>Talenti</th><th>Totale</th><th>Mod.</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  function abilGuide(R) {
    return `<div class="panel">${ph('A cosa serve ogni caratteristica', 'abilita')}<p class="lead">Per ogni caratteristica: cosa misura, quali abilità usa e per quali classi è la più importante.</p><div class="abil-guide">${ABIL.map(a => {
      const cls = D.classes.filter(c => (c.primary || []).includes(a.id)).map(c => c.it);
      const mine = R.c && (R.c.primary || []).includes(a.id);
      return `<div class="ag"${mine ? ' style="border-color:var(--accent)"' : ''}><h3>${a.it}<span>${R.score[a.id] ?? ''}${R.mod[a.id] != null ? ` (${sign(R.mod[a.id])})` : ''}</span></h3><p>${ABDESC[a.id]}.</p>
        <p><b>Abilità:</b> ${SKILLS.filter(s => s.ab === a.id).map(s => s.it).join(', ') || 'nessuna (aumenta i punti ferita)'}</p>
        <p><b>Principale per:</b> ${cls.join(', ') || '—'}</p></div>`;
    }).join('')}</div></div>`;
  }
  function renderTabAbil(R, st) {
    $('tab-caratteristiche').innerHTML = intro('3', 'Decidi i punteggi di caratteristica', 'Sei numeri descrivono il personaggio. Scegli un metodo per ottenerli, assegnali alle caratteristiche (le più alte a quella principale della classe) e distribuisci il bonus del background.', 38)
      + builderHTML(R) + abilGuide(R) + nextbar('caratteristiche', st);
  }

  // ------------------------------------------------------------------ passo 4: allineamento
  function renderTabAlign(R, st) {
    const rowsAx = [['L', 'Legale'], ['N', 'Neutrale'], ['C', 'Caotico']], colsAx = [['B', 'Buono'], ['N', 'Neutrale'], ['M', 'Malvagio']];
    let grid = '<div></div>' + colsAx.map(c => `<div class="ax">${c[1]}</div>`).join('');
    rowsAx.forEach(r => {
      grid += `<div class="ax">${r[1]}</div>`;
      colsAx.forEach(c => {
        const code = r[0] === 'N' && c[0] === 'N' ? 'N' : r[0] + c[0];
        const a = ALIGN.find(x => x[0] === code);
        grid += card('allineamento', a[0], S.allineamento === a[0], `<div class="c-name" style="font-size:16px">${a[1]}</div><div class="c-en">${a[2]}</div><p class="c-desc">${esc(a[3])}.</p>${c[0] === 'M' ? '<div class="sub">Da concordare con il DM.</div>' : ''}`);
      });
    });
    $('tab-allineamento').innerHTML = intro('4', 'Scegli l\'allineamento', 'Descrive il modo di comportarsi del personaggio su due assi: buono/malvagio e legale/caotico. Non ha effetti sulle regole: serve a interpretarlo. Il manuale presume personaggi non malvagi.', 39)
      + `<div class="panel">${ph('I nove allineamenti', 'allineamento')}<div class="align">${grid}</div></div>` + nextbar('allineamento', st);
  }

  // ------------------------------------------------------------------ passo 5: dettagli
  function skillsHTML(R) {
    let h = '';
    if (!R.skillSrc.length) h += hint('Scegli classe e background: ti diranno quali abilità puoi prendere.');
    R.skillSrc.forEach(src => {
      h += `<div class="srcblock"><b>${esc(src.label)}</b>`;
      if (src.fixed) h += `<div class="chips" style="margin-top:4px">${src.fixed.map(s => `<span class="chip">🔒 ${SK[s].it}</span>`).join('')}</div>`;
      if (src.choose) {
        const from = src.from === 'any' || !src.from ? SKILLS.map(s => s.id) : src.from.filter(s => SK[s]);
        const others = new Set();
        R.skillSrc.forEach(o => (o.fixed || []).forEach(s => others.add(s)));
        R.skillSrc.forEach(o => o.picks.forEach(v => { if (v && o !== src) others.add(v); }));
        h += `<div class="sub">Scegline ${src.choose}${src.from === 'any' ? ' fra tutte' : ''}.</div><div class="picks">`;
        for (let i = 0; i < src.choose; i++) {
          const mine = src.picks.filter((v, j) => j !== i);
          h += selectHTML('sk_' + src.key + '_' + i, from.map(s => ({ v: s, t: `${SK[s].it} (${AB[SK[s].ab].short} ${sign(R.mod[SK[s].ab])})`, dis: others.has(s) || mine.includes(s) })));
        }
        h += '</div>';
      }
      h += '</div>';
    });
    if (R.expN) {
      h += `<div class="srcblock"><b>Maestria ${help('maestria')}</b><div class="sub">Scegli ${R.expN} abilità in cui sei già competente: il bonus di competenza raddoppia.</div><div class="picks">`;
      const profs = [...R.prof];

  // ------------------------------------------------------------------ scheda finale
  function weaponRow(i, R) {
    const k = 'arma_' + i;
    const v = S[k] || '';
    const opts = [];
    [['semplice', 'mischia', 'Armi semplici da mischia'], ['semplice', 'distanza', 'Armi semplici a distanza'], ['marziale', 'mischia', 'Armi da guerra da mischia'], ['marziale', 'distanza', 'Armi da guerra a distanza']].forEach(([cat, type, g]) =>
      (EQ.weapons || []).filter(w => w.category === cat && w.type === type).forEach(w => opts.push({ v: w.id, g, t: `${weaponProficient(w, R) ? '★ ' : ''}${w.it || w.en} (${w.damage})` })));
    userSpells().filter(s => s.level === 0).concat(R.autoSpells.map(a => spellByEn(a.en)).filter(s => s && s.level === 0))
      .forEach(s => opts.push({ v: 'sp:' + s.id, g: 'I tuoi trucchetti', t: nm(s) }));
    opts.push({ v: 'custom', g: 'Altro', t: '✎ Scrivo io' });
    if (v === 'custom') {
      return `<tr><td>${selectHTML(k, opts, { ph: '—' })}<input type="text" data-k="${k}_n" data-free placeholder="nome" value="${esc(S[k + '_n'] || '')}" style="margin-top:4px"></td>
        <td><input type="text" data-k="${k}_b" data-free value="${esc(S[k + '_b'] || '')}"></td><td><input type="text" data-k="${k}_d" data-free value="${esc(S[k + '_d'] || '')}"></td><td><input type="text" data-k="${k}_x" data-free value="${esc(S[k + '_x'] || '')}"></td></tr>`;
    }
    let bonus = '', dmg = '', note = '';
    if (v.startsWith('sp:')) {
      const s = SPELL[v.slice(3)];
      if (s && R.cast) bonus = `${sign(R.cast.atk)} / CD ${R.cast.dc}`;
      if (s) { dmg = esc(s.desc || ''); note = `${esc(ftm(s.range))}${s.higher ? ' · ' + esc(s.higher) : ''}`; }
    } else if (v) {
      const w = byId(EQ.weapons, v);
      if (w) {
        const has = p => (w.properties || []).some(x => norm(x) === norm(p));
        let ab = w.type === 'distanza' ? 'des' : 'for';
        const monk = R.c && R.c.id === 'monk' && w.type === 'mischia' && (w.category === 'semplice' || has('Light'));
        if (has('Finesse') || monk) ab = (R.mod.for || 0) >= (R.mod.des || 0) ? 'for' : 'des';
        const prof = weaponProficient(w, R);
        const m = R.mod[ab] || 0;
        const ms = m ? (m > 0 ? '+' + m : String(m)) : '';
        bonus = sign(m + (prof ? R.pb : 0)) + ` <span class="sub">${AB[ab].short}${prof ? ' + comp.' : ''}</span>`;
        dmg = `${w.damage}${ms} ${esc(w.damageType || '')}` + (w.versatile ? `<div class="wsub">a due mani ${w.versatile}${ms}</div>` : '');
        const props = (w.properties || []).map(p => { const P = PROP[norm(p)]; return `<span title="${esc(P ? P.desc : '')}">${esc(P ? P.it : p)}</span>`; });
        if (w.range) props.push('gittata ' + esc(w.range));
        const ma = MAST[norm(w.mastery)];
        if (w.mastery && R.wmN) props.push(R.mastery.has(w.id) ? `<b title="${esc(ma ? ma.desc : '')}">padronanza: ${esc(ma ? ma.it : w.mastery)}</b>` : `<span title="${esc(ma ? ma.desc : '')}">padronanza ${esc(ma ? ma.it : w.mastery)} (non attiva)</span>`);
        if (!prof) props.push('<span class="warn">⚠ senza competenza</span>');
        note = props.join(' · ');
        // Randello incantato (Shillelagh): attacco e danni con la caratteristica da incantatore, dado che sale col livello
        const shil = (w.id === 'club' || w.id === 'quarterstaff') && R.cast
          && userSpells().concat(R.autoSpells.map(a => spellByEn(a.en)).filter(Boolean)).some(s => s.id === 'shillelagh');
        if (shil) {
          const sm = R.cast.mod || 0, die = R.L >= 17 ? '2d6' : R.L >= 11 ? '1d12' : R.L >= 5 ? '1d10' : '1d8';
          bonus += `<div class="wsub" title="Con Randello incantato attivo: ${AB[R.cast.ability].it} + competenza">Randello inc.: <b>${sign(sm + R.pb)}</b></div>`;
          dmg += `<div class="wsub" title="Con Randello incantato attivo: danni contundenti o da forza">Randello inc.: <b>${die}${sm ? (sm > 0 ? '+' + sm : sm) : ''}</b></div>`;
        }
      }
    }
    return `<tr${v ? '' : ' class="empty"'}><td style="min-width:170px">${selectHTML(k, opts, { ph: '—' })}</td><td class="b">${bonus}</td><td>${dmg}</td><td class="wnote">${note}</td></tr>`;
  }

  function traitsCompact(R) {

  function renderSheet(R) {

  // ------------------------------------------------------------------ personaggi salvati e confronto
  // compute() e sheetHTML() leggono S: per un altro personaggio lo si scambia per un momento
  function withChar(s, fn) {
    const old = S;
    S = JSON.parse(JSON.stringify(s || {})); defaults();
    try { return fn(); } finally { S = old; }
  }
  const charIds = () => Object.keys(STORE.chars).sort((a, b) => (STORE.chars[b].upd || 0) - (STORE.chars[a].upd || 0));
  const charName = s => (s && s.nome && String(s.nome).trim()) || 'Senza nome';
  const slug = t => String(t || '').trim().replace(/[^\w\-àèéìòù ]+/gi, '').replace(/\s+/g, '-') || 'personaggio';
  const fmtDate = t => t ? new Date(t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const hpOf = (s, R) => s.pf_manuale ? (parseInt(s.pf_max_man, 10) || null) : (R.hpCalc ?? null);
  function charLine(R) {
    const parts = [R.c ? `${esc(R.c.it)} ${R.L}° liv.${R.sub ? ' · ' + esc(R.sub.it || R.sub.en) : ''}` : 'classe da scegliere'];
    if (R.sp) parts.push(esc(R.sp.it));
    if (R.bg) parts.push(esc(R.bg.it));

  }
  function charCard(id) {
    const ch = STORE.chars[id];

    const cur = id === STORE.cur, fav = id === STORE.preferito;
    return `<div class="char${cur ? ' cur' : ''}">
      <h3>${esc(charName(ch.S))}${cur ? ' <span class="badge">aperto ora</span>' : ''}${fav ? ' <span class="badge fav">★ preferito</span>' : ''}</h3>
      <div class="meta">${charLine(R)}</div>

        <button type="button" class="btn" data-act="printChar" data-id="${id}" title="Scarica la scheda pronta da stampare o salvare in PDF">Stampabile</button>

  // Tabella con i personaggi in colonna: in verde il valore più alto di ogni riga
  function compareHTML(ids) {
    const list = ids.map(id => ({ id, s: STORE.chars[id].S, R: withChar(STORE.chars[id].S, compute) }));
    const wins = {}; ids.forEach(id => { wins[id] = 0; });
    const rows = [];
    const grp = t => rows.push(`<tr class="grp"><th colspan="${ids.length + 1}">${t}</th></tr>`);
    const num = (label, get, fmt, counts = true) => {
      const vals = list.map(get);
      const nums = vals.filter(v => typeof v === 'number');
      const max = nums.length ? Math.max(...nums) : null;
      const best = counts && nums.length > 1 && nums.some(v => v !== max) ? max : null;
      rows.push(`<tr><th scope="row">${label}</th>${list.map((x, i) => {
        const b = best != null && vals[i] === best;
        if (b) wins[x.id]++;
        return `<td${b ? ' class="best"' : ''}>${vals[i] == null ? '—' : fmt ? fmt(vals[i], x) : vals[i]}</td>`;
      }).join('')}</tr>`);
    };
    const txt = (label, get) => rows.push(`<tr><th scope="row">${label}</th>${list.map(x => `<td class="txt">${get(x) || '<span class="sub">—</span>'}</td>`).join('')}</tr>`);
    grp('Chi è');
    txt('Classe', x => x.R.c ? esc(x.R.c.it) + (x.R.sub ? `<br><span class="sub">${esc(x.R.sub.it || x.R.sub.en)}</span>` : '') : '');
    num('Livello', x => x.R.c ? x.R.L : null, null, false);
    txt('Difficoltà', x => x.R.c && x.R.c.complexity ? esc(x.R.c.complexity) : '');
    txt('Specie', x => x.R.sp ? esc(x.R.sp.it) : '');
    txt('Background', x => x.R.bg ? esc(x.R.bg.it) : '');
    grp('Caratteristiche');
    ABIL.forEach(a => num(a.it, x => x.R.score[a.id] ?? null, (v, x) => `${v} <span class="sub">(${sign(x.R.mod[a.id])})</span>`));
    num('Somma dei punteggi', x => ABIL.every(a => x.R.score[a.id] != null) ? ABIL.reduce((t, a) => t + x.R.score[a.id], 0) : null);
    grp('In combattimento');
    num('Punti ferita', x => hpOf(x.s, x.R));
    num('Classe armatura', x => x.R.ac ?? null);
    num('Iniziativa', x => x.R.init ?? null, v => sign(v));
    num('Velocità (piedi)', x => x.R.sp ? x.R.speed : null);
    num('Percezione passiva', x => x.R.pp ?? null);
    grp('Magia e abilità');
    num('CD dei tuoi incantesimi', x => x.R.cast && x.R.cast.dc != null ? x.R.cast.dc : null);
    num('Slot incantesimo', x => x.R.cast ? x.R.cast.slots.reduce((t, n) => t + n, 0) + (x.R.cast.pact ? x.R.cast.pact.n : 0) : null);
    num('Abilità con competenza', x => x.R.prof.size || null);
    txt('Tiri salvezza forti', x => [...x.R.saves].map(id => (ABIL.find(a => a.id === id) || {}).it).filter(Boolean).join(', '));
    txt('Talenti', x => x.R.feats.filter(sl => sl.feat).map(sl => esc(sl.feat.it || sl.feat.en)).join(', '));
    const top = Math.max(...ids.map(id => wins[id]));
    const head = `<tr><th scope="row"></th>${list.map(x => `<th${x.id === STORE.preferito ? ' class="fav"' : ''}>${esc(charName(x.s))}${x.id === STORE.preferito ? ' <span class="badge fav">★</span>' : ''}<span class="sub">${x.R.c ? esc(x.R.c.it) + ' ' + x.R.L + '° liv.' : 'classe da scegliere'}</span></th>`).join('')}</tr>`;
    const tot = `<tr class="tot"><th scope="row">Righe in verde</th>${list.map(x => `<td${top > 0 && wins[x.id] === top ? ' class="best"' : ''}>${wins[x.id]}</td>`).join('')}</tr>`;
    const pick = `<tr><th scope="row">La tua scelta</th>${list.map(x => `<td>${x.id === STORE.preferito ? '<span class="badge fav">★ Preferito</span>' : `<button type="button" class="btn" data-act="favChar" data-id="${x.id}">★ Scegli questo</button>`}</td>`).join('')}</tr>`;
    return `<div class="cmp-wrap"><table class="vs"><thead>${head}</thead><tbody>${rows.join('')}${tot}${pick}</tbody></table></div>`;
  }
  function renderTabChars() {

  // ------------------------------------------------------------------ azioni sui personaggi
  function openChar(id) {
    if (!STORE.chars[id]) return;
    STORE.cur = id; S = STORE.chars[id].S; defaults();
    if (!TABS.some(t => t.id === S._tab)) S._tab = 'classe';

  function addChar(s, id) {
    id = id || newId();

    if (!isBlank(s)) dirty.add(id);
    return id;
  }
  function newChar() {
    if (isBlank(S)) { UI.page = null; S._tab = 'classe'; renderAll(); window.scrollTo({ top: 0 }); toast('Questa scheda è già vuota: puoi iniziare da qui.'); return; }
    openChar(addChar({ _tab: 'classe' }));

  }
  function dupChar(id) {
    if (!STORE.chars[id]) return;
    if (isBlank(STORE.chars[id].S)) { toast('Questa scheda è vuota: non c\'è niente da copiare.'); return; }
    const c = JSON.parse(JSON.stringify(STORE.chars[id].S));
    const orig = charName(c);
    c.nome = orig + ' (copia)';
    // la copia si apre subito, allo stesso passo dell'originale

  async function delChar(id) {
    const name = charName(STORE.chars[id].S);
    if (!(await askConfirm(`Eliminare «${name}»? Non si può annullare, a meno che tu non abbia un salvataggio scaricato.`, 'Elimina'))) return;
    delete STORE.chars[id]; dirty.add(id);
    if (STORE.preferito === id) { STORE.preferito = null; dirtyMeta = true; }
    if (id === STORE.cur) {
      const rest = charIds();
      STORE.cur = rest.length ? rest[0] : addChar({});
      S = STORE.chars[STORE.cur].S; defaults();
    }
    saveAll(); renderAll();
    toast(`«${name}» eliminato.`);
  }
  function favChar(id) {
    STORE.preferito = id; dirtyMeta = true;

  // ------------------------------------------------------------------ file: salvataggio e scheda stampabile
  const DL = IN_CLAUDE ? window.claude.use('downloads') : Promise.resolve(null);
  async function saveFile(filename, text, type, preview) {
    if (IN_CLAUDE) {
      let ready = false;
      setTimeout(() => { if (!ready) toast('Preparo il file, un momento…'); }, 300);
      const dl = await DL;
      ready = true;
      if (!dl) { noDownload(preview); return; }
      try { await dl.save({ filename, data: text }); toast('File salvato ✓'); }
      catch (e) { if (!e || e.code !== 'declined') toast('Non è stato possibile salvare il file.'); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('File scaricato ✓');
  }
  function saveBundle() {
    const ids = charIds().filter(id => !isBlank(STORE.chars[id].S));
    if (!ids.length) { toast('Non c\'è ancora nessun personaggio da salvare.'); return; }
    const data = { formato: 'scheda-dnd-2024', versione: 3, salvato: new Date().toISOString(), preferito: STORE.preferito || null,
      personaggi: ids.map(id => ({ id, upd: STORE.chars[id].upd, scheda: STORE.chars[id].S })) };
    saveFile(`personaggi-dnd-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 1), 'application/json');
  }
  // Accetta il file nuovo (più personaggi) e quello vecchio (un solo personaggio): non sovrascrive mai versioni più recenti
  function importText(text) {
    let d = null;
    try { d = JSON.parse(text); } catch (e) { d = null; }
    const list = d && Array.isArray(d.personaggi) ? d.personaggi.filter(p => p && p.scheda).map(p => ({ id: /^p[a-z0-9]+$/.test(p.id || '') ? p.id : null, upd: p.upd || 0, s: p.scheda }))
      : d && typeof d === 'object' && !Array.isArray(d) ? [{ id: null, upd: 0, s: d }] : [];
    const ok = list.filter(p => p.s && typeof p.s === 'object' && !Array.isArray(p.s) && !isBlank(p.s));
    if (!ok.length) { toast('Questo file non contiene personaggi della scheda.'); return; }
    const wasBlank = isBlank(S) ? STORE.cur : null;
    let n = 0, first = null;
    ok.forEach(p => {
      const have = p.id && STORE.chars[p.id];
      if (have && (have.upd || 0) >= p.upd) { first = first || p.id; return; }
      const id = addChar(JSON.parse(JSON.stringify(p.s)), p.id || null);
      if (p.upd) STORE.chars[id].upd = p.upd;
      first = first || id; n++;
    });
    if (d && d.preferito && STORE.chars[d.preferito] && !STORE.preferito) { STORE.preferito = d.preferito; dirtyMeta = true; }
    if (wasBlank && first && wasBlank !== first) { delete STORE.chars[wasBlank]; dirty.add(wasBlank); STORE.cur = first; S = STORE.chars[first].S; defaults(); }
    UI.page = 'personaggi';
    saveAll(); renderAll(); window.scrollTo({ top: 0 });
    toast(n ? `Caricati ${n} personaggi ✓` : 'Questi personaggi erano già salvati qui.');
  }
  function importInput(input) {
    const file = input.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { importText(String(r.result || '')); input.value = ''; };
    r.readAsText(file);
  }
  // Pagina autonoma con la sola scheda finale: si apre nel browser e si stampa o salva in PDF
  function printChar(id) {

    const html = `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(name)} · scheda D&amp;D 2024</title><style>${css}
.printbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 20px; background: #2a221d; color: #fff; font-size: 14px; }
.printbar button { cursor: pointer; background: #fff; color: #2a221d; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 600; }
@media print { .printbar { display: none; } }</style></head><body class="nohelp"><div class="printbar"><span>Scheda di <b>${esc(name)}</b>. Per un PDF scegli «Salva come PDF» nella finestra di stampa.</span><button type="button" onclick="print()">Stampa o salva in PDF</button></div><main class="wrap"><section class="tab active" id="tab-scheda">${tmp.innerHTML}</section></main></body></html>`;
